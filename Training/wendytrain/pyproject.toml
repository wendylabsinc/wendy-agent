[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wendytrain"
version = "0.1.0"
description = "Framework-agnostic training harness core for WendyOS fleet training"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["wendytrain*"]
