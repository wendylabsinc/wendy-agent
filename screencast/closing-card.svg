<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <rect width="1440" height="900" fill="#FFFFFF"/>
  <rect x="54" y="54" width="1332" height="792" rx="32" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="3"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">
    <g transform="translate(96 96)">
      <rect x="0" y="0" width="300" height="52" rx="26" fill="#9FE2BF"/>
      <text x="30" y="35" font-size="22" font-weight="800" letter-spacing="1.8" fill="#000000">{{TITLE}}</text>
      <text x="0" y="112" font-size="34" font-weight="550" fill="#525252">{{SUBTITLE}}</text>
    </g>

    <g transform="translate(96 320)">
      <text x="0" y="0" font-size="56" font-weight="850" fill="#000000">Questions or follow-ups?</text>
      <text x="0" y="92" font-size="40" font-weight="650" fill="#262626">{{WEBSITE}}</text>
      <text x="0" y="188" font-size="72" font-weight="850" fill="#000000">{{CONTACT}}</text>
    </g>

    <g transform="translate(96 678)">
      <rect x="0" y="0" width="1248" height="96" rx="22" fill="#F5F5F5" stroke="#E5E5E5" stroke-width="2"/>
      <text x="30" y="59" font-size="31" font-weight="650" fill="#404040">{{AUTHOR}}</text>
    </g>

    <g transform="translate(96 812)" font-size="24" font-weight="600" fill="#737373">
      <text x="0" y="0">{{PLACE}}</text>
      <text x="0" y="36">{{DATE}}</text>
    </g>
  </g>
</svg>
