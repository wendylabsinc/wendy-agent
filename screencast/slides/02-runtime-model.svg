<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <rect width="1440" height="900" fill="#FFFFFF"/>
  <rect x="54" y="54" width="1332" height="792" rx="32" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="3"/>
  <rect x="96" y="96" width="270" height="52" rx="26" fill="#9FE2BF"/>
  <text x="126" y="131" class="eyebrow">RUNTIME MODEL</text>
  <foreignObject x="96" y="210" width="1220" height="180">
    <div xmlns="http://www.w3.org/1999/xhtml" class="title">Declare → sync → mount read-only.</div>
  </foreignObject>
  <foreignObject x="96" y="390" width="1180" height="120">
    <div xmlns="http://www.w3.org/1999/xhtml" class="subtitle">Wendy manages the files in an app-scoped area on the device.</div>
  </foreignObject>
  <rect x="96" y="546" width="758" height="56" rx="28" fill="#E9F8EF" stroke="#9FE2BF" stroke-width="2"/><text x="124" y="583" class="chip">relative project paths</text><rect x="96" y="632" width="780" height="56" rx="28" fill="#E9F8EF" stroke="#9FE2BF" stroke-width="2"/><text x="124" y="669" class="chip">optional to destination</text><rect x="96" y="718" width="694" height="56" rx="28" fill="#E9F8EF" stroke="#9FE2BF" stroke-width="2"/><text x="124" y="755" class="chip">cleanup with the app</text>
  <line x1="96" x2="1344" y1="742" y2="742" stroke="#E5E5E5" stroke-width="3"/>
  <text x="96" y="798" class="footer">deployment input ≠ persistent volume</text>
  <style>
    text, div { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .eyebrow { fill: #000000; font-size: 22px; font-weight: 800; letter-spacing: 1.8px; }
    .title { color: #000000; font-size: 76px; line-height: 1.05; font-weight: 850; }
    .subtitle { color: #404040; font-size: 38px; line-height: 1.25; font-weight: 500; }
    .chip { fill: #000000; font-size: 26px; font-weight: 750; }
    .footer { fill: #525252; font-size: 30px; font-weight: 650; }
  </style>
</svg>
