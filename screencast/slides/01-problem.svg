<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <rect width="1440" height="900" fill="#171717"/>
  <rect x="64" y="64" width="1312" height="772" rx="28" fill="#202020" stroke="#3a3a3a" stroke-width="2"/>
  <rect x="88" y="88" width="190" height="38" rx="19" fill="#274b37"/>
  <text x="112" y="114" class="eyebrow">WHY THIS EXISTS</text>
  <text x="96" y="236" class="title">Inputs change faster than images</text>
  <foreignObject x="96" y="278" width="1160" height="112">
    <div xmlns="http://www.w3.org/1999/xhtml" class="subtitle">Prompts, model sidecars, calibration files, and fixtures are deployment inputs — not application code.</div>
  </foreignObject>
  <circle cx="112" cy="416" r="7" fill="#73e6a7"/><text x="136" y="424" class="bullet">Avoid rebuilds for every data tweak</text><circle cx="112" cy="488" r="7" fill="#73e6a7"/><text x="136" y="496" class="bullet">Make inputs explicit in wendy.json</text><circle cx="112" cy="560" r="7" fill="#73e6a7"/><text x="136" y="568" class="bullet">Keep the run path repeatable for teams</text>
  <line x1="96" x2="1344" y1="742" y2="742" stroke="#3a3a3a" stroke-width="2"/>
  <text x="96" y="792" class="footer">WDY-1532 · file sync for wendy run</text>
  <style>
    text, div { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Monaco, monospace; }
    .eyebrow { fill: #a8f5c3; font-size: 18px; font-weight: 700; letter-spacing: 2px; }
    .title { fill: #f4f4f4; font-size: 52px; font-weight: 800; }
    .subtitle { color: #cfcfcf; font-size: 28px; line-height: 1.35; }
    .bullet { fill: #f0f0f0; font-size: 29px; font-weight: 600; }
    .footer { fill: #9d9d9d; font-size: 22px; }
  </style>
</svg>
