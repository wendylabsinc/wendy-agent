syntax = "proto3";

package wendycloud.v2;

import "pkicore/v1/engine.proto";
import "pkicore/v1/fabric_management.proto";
import "pkicore/v1/fabric_relay.proto";
import "pkicore/v1/types.proto";
import "wendy/options.proto";
import "wendycloud/v2/signed_request.proto";

// PKIAdminService is cloud's relay to pki-core's FabricManagementService and
// FabricRelayService for tenant PKI administration (WDY-3409). pki-core's
// ledger is the only certificate inventory; cloud stores none of it. Responses
// are pki-core's own messages, passed through.
//
// Each RPC comment names its gate: the catalog permission the caller must hold
// in organization_id, checked before pki-core is called.
//
// "Signed, op X" means the call is a pki-core tier-3 operation: its input is a
// SignedRequest carrying cloud's request signature AND the operator's pki-core
// management request (pki_management_request, op X), relayed verbatim as the
// Envelope signed_artifact. The operation's parameters (paging, filters,
// serial, principal, reason, policy, CA id) live in that signed request only,
// so the request messages here carry just organization_id. Its jti is single
// use: a retry needs a fresh management request.
//
// For the credential-class writes (both revokes, deny), cloud also attaches its
// signed rights attestation for the gate permission, bound to the operator who
// signed the management request, as it does for over-duration approval.
//
// Every mutation here is operator-signed (WDY-3458). The enrollment and
// over-duration RPCs are not tier-3: they leave pki_management_request unset,
// and the operator's own pki-core artifact (enrollment request, over-duration
// request/approval/pickup JWS) stays a field of the signed payload.
service PKIAdminService {
  // --- Certificates ---

  // Tenant-wide certificate inventory. Gate: `pki:cert-list`. Signed, op
  // "list_cert_metadata".
  // Signed; payload_type "wendycloud.v2.ListIssuedCertificatesRequest".
  rpc ListIssuedCertificates(SignedRequest) returns (pkicore.v1.ListCertMetadataResponse) {
    option (wendy.signed_request) = true;
  }
  // One certificate by serial. Gate: `pki:cert-read`. Signed, op
  // "list_cert_metadata" with the serial filter. NOT_FOUND if no row matches.
  // Signed; payload_type "wendycloud.v2.GetIssuedCertificateRequest".
  rpc GetIssuedCertificate(SignedRequest) returns (pkicore.v1.CertMetadata) {
    option (wendy.signed_request) = true;
  }
  // Gate: `pki:cert-revoke`. Signed, op "revoke_certificate"; rights attested.
  // Signed; payload_type "wendycloud.v2.RevokeIssuedCertificateRequest".
  rpc RevokeIssuedCertificate(SignedRequest) returns (pkicore.v1.RevokeCertificateResponse) {
    option (wendy.signed_request) = true;
  }
  // Every live certificate of one SPIFFE principal. Gate: `pki:cert-revoke`.
  // Signed, op "revoke_principal"; rights attested.
  // Signed; payload_type "wendycloud.v2.RevokePrincipalCertificatesRequest".
  rpc RevokePrincipalCertificates(SignedRequest) returns (pkicore.v1.RevokeByPrincipalResponse) {
    option (wendy.signed_request) = true;
  }

  // --- Certificate authorities (CRL/OCSP status rides on CAInfo) ---

  // Gate: `pki:ca-list`.
  rpc ListCertificateAuthorities(ListCertificateAuthoritiesRequest) returns (pkicore.v1.ListCAsResponse);
  // Gate: `pki:ca-rotate`. Signed, op "rotate_ca".
  // Signed; payload_type "wendycloud.v2.RotateCertificateAuthorityRequest".
  rpc RotateCertificateAuthority(SignedRequest) returns (pkicore.v1.RotateCAResponse) {
    option (wendy.signed_request) = true;
  }
  // Gate: `pki:ca-migrate`. Signed, op "migrate_ca".
  // Signed; payload_type "wendycloud.v2.MigrateCertificateAuthorityRequest".
  rpc MigrateCertificateAuthority(SignedRequest) returns (pkicore.v1.MigrateCAResponse) {
    option (wendy.signed_request) = true;
  }

  // --- Enrollment tokens and EAB keys ---

  // Gate: `pki:enrollment-token-list`.
  rpc ListEnrollmentTokens(ListEnrollmentTokensRequest) returns (pkicore.v1.ListEnrollmentTokensResponse);
  // Gate: `pki:eab-list`.
  rpc ListEABKeys(ListEABKeysRequest) returns (pkicore.v1.ListEABKeysResponse);
  // Creates an enrollment token or an EAB key; the operator's signed
  // enrollment request decides which (FabricRelayService.RelayEnrollment).
  // Gate: `pki:enrollment-token-create` for both kinds. The secret in the
  // response is returned once only.
  // Signed; payload_type "wendycloud.v2.CreateEnrollmentCredentialRequest".
  rpc CreateEnrollmentCredential(SignedRequest) returns (pkicore.v1.RelayEnrollmentResponse) {
    option (wendy.signed_request) = true;
  }
  // Gate: `pki:enrollment-token-revoke`.
  // Signed; payload_type "wendycloud.v2.RevokeEnrollmentTokenRequest".
  rpc RevokeEnrollmentToken(SignedRequest) returns (pkicore.v1.RevokeEnrollmentTokenResponse) {
    option (wendy.signed_request) = true;
  }
  // Gate: `pki:eab-revoke`.
  // Signed; payload_type "wendycloud.v2.RevokeEABKeyRequest".
  rpc RevokeEABKey(SignedRequest) returns (pkicore.v1.RevokeEABKeyResponse) {
    option (wendy.signed_request) = true;
  }

  // --- Tenant policy ---

  // Gate: `pki:policy-read`.
  rpc GetTenantPolicy(GetTenantPolicyRequest) returns (pkicore.v1.GetTenantPolicyResponse);
  // Gate: `pki:policy-write`. Signed, op "set_policy".
  // Signed; payload_type "wendycloud.v2.SetTenantPolicyRequest".
  rpc SetTenantPolicy(SignedRequest) returns (pkicore.v1.SetTenantPolicyResponse) {
    option (wendy.signed_request) = true;
  }

  // --- Over-duration issuance (four-eyes) ---

  // Gate: `pki:over-duration-request`.
  // Signed; payload_type "wendycloud.v2.RequestOverDurationRequest".
  rpc RequestOverDuration(SignedRequest) returns (pkicore.v1.OverDurationRequestResponse) {
    option (wendy.signed_request) = true;
  }
  // Gate: `pki:over-duration-list`.
  rpc ListPendingOverDuration(ListPendingOverDurationRequest) returns (pkicore.v1.ListPendingOverDurationRequestsResponse);
  // Gate: `pki:approve-over-duration`; rights attested. Supersedes cloud's own
  // OverDurationApprovalService.ApproveOverDurationIssuance. The four-eyes
  // approval JWS stays in the payload; cloud still attaches the rights
  // attestation when it relays.
  // Signed; payload_type "wendycloud.v2.ApproveOverDurationRequest".
  rpc ApproveOverDuration(SignedRequest) returns (pkicore.v1.OverDurationApprovalResponse) {
    option (wendy.signed_request) = true;
  }
  // Gate: `pki:approve-over-duration`. Signed, op "deny_over_duration";
  // rights attested.
  // Signed; payload_type "wendycloud.v2.DenyOverDurationRequest".
  rpc DenyOverDuration(SignedRequest) returns (pkicore.v1.DenyOverDurationIssuanceResponse) {
    option (wendy.signed_request) = true;
  }
  // Gate: `pki:over-duration-collect`. Not idempotent: a second collect is
  // ALREADY_EXISTS (see PickupOverDurationCertificate).
  // Signed; payload_type "wendycloud.v2.CollectOverDurationRequest".
  rpc CollectOverDuration(SignedRequest) returns (pkicore.v1.RelayOverDurationPickupResponse) {
    option (wendy.signed_request) = true;
  }

  // --- Audit and offboarding ---

  // Gate: `pki:audit-read`. Signed, op "get_audit_log".
  // Signed; payload_type "wendycloud.v2.ListAuditLogRequest".
  rpc ListAuditLog(SignedRequest) returns (stream pkicore.v1.AuditLogEntry) {
    option (wendy.signed_request) = true;
  }
  // Gate: `pki:tenant-offboard`. Signed, op "offboard_tenant".
  // Signed; payload_type "wendycloud.v2.OffboardTenantRequest".
  rpc OffboardTenant(SignedRequest) returns (pkicore.v1.OffboardTenantResponse) {
    option (wendy.signed_request) = true;
  }
}

message ListIssuedCertificatesRequest { string organization_id = 1; }
message GetIssuedCertificateRequest { string organization_id = 1; }
message RevokeIssuedCertificateRequest { string organization_id = 1; }
message RevokePrincipalCertificatesRequest { string organization_id = 1; }

message ListCertificateAuthoritiesRequest { string organization_id = 1; }
message RotateCertificateAuthorityRequest { string organization_id = 1; }
message MigrateCertificateAuthorityRequest { string organization_id = 1; }

message ListEnrollmentTokensRequest {
  string organization_id = 1;
  int32  page_size       = 2;
  string page_token      = 3;
  bool   show_consumed   = 4; // false: only unused, non-revoked tokens
}

message ListEABKeysRequest {
  string organization_id = 1;
  int32  page_size       = 2;
  string page_token      = 3;
  string status_filter   = 4; // "active" | "consumed" | "revoked" | "" (all)
}

message CreateEnrollmentCredentialRequest {
  string organization_id = 1;
  // The operator's "enrollment-request+jws", relayed verbatim.
  string signed_request  = 2;
}

message RevokeEnrollmentTokenRequest {
  string organization_id = 1;
  string token_id        = 2;
}

message RevokeEABKeyRequest {
  string organization_id = 1;
  string key_id          = 2;
}

message GetTenantPolicyRequest { string organization_id = 1; }
message SetTenantPolicyRequest { string organization_id = 1; }

message RequestOverDurationRequest {
  string organization_id = 1;
  // The operator's "over-duration-request+jws", relayed verbatim.
  string signed_request  = 2;
  // DER RFC 3161 TimeStampResp over signed_request.
  bytes  timestamp_token = 3;
}

message ListPendingOverDurationRequest { string organization_id = 1; }

message ApproveOverDurationRequest {
  string organization_id    = 1;
  string pending_request_id = 2;
  // The approver's "over-duration-approval+jws", relayed verbatim; must be
  // signed by the caller's own operator leaf.
  string signed_approval    = 3;
  // DER RFC 3161 TimeStampResp over signed_approval.
  bytes  timestamp_token    = 4;
}

message DenyOverDurationRequest { string organization_id = 1; }

message CollectOverDurationRequest {
  string organization_id      = 1;
  string collection_id        = 2;
  // DER of the collecting operator's leaf (must be the requester's).
  bytes  operator_certificate = 3;
  // The operator's "over-duration-pickup+jws", relayed verbatim.
  string signed_pickup        = 4;
}

message ListAuditLogRequest { string organization_id = 1; }
message OffboardTenantRequest { string organization_id = 1; }
