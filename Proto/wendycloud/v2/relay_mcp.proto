syntax = "proto3";

package wendycloud.v2;

import "google/protobuf/timestamp.proto";
import "wendy/options.proto";
import "wendycloud/v2/signed_request.proto";

// RelayMcpService is the CLI side of the hosted MCP relay (WDY-3656/3657,
// docs/relay-mcp.md). The user's CLI (`wendy cloud mcp`) opens a session and
// holds it with one stream; the relay forwards the MCP frames of web chats
// bound to that session over it. The relay holds no Wendy credential and is
// never a principal: the CLI executes every tool call itself and signs each
// cloud call as an ordinary SignedRequest with channel
// REQUEST_CHANNEL_HOSTED_MCP. No new permission: the gate is membership of
// organization_id's tenant plus the realm's Allow MCP and Allow Hosted MCP
// settings (claims `allow_mcp` and `allow_hosted_mcp` on the operator's
// access token).
service RelayMcpService {
  // Opens a relay session for the caller in organization_id's realm.
  // Authenticated and verified as every cloud signed RPC (same access token,
  // DPoP proof, aud, pki-core leaf verdict and nonce rules,
  // conformance/reqsig/README.md), sent with channel UNSPECIFIED. A token with
  // scope `mcp:relay` (a web chat's) is refused on this service with
  // UNAUTHENTICATED. PERMISSION_DENIED when the caller's token lacks
  // `allow_mcp: true` or `allow_hosted_mcp: true`.
  // Signed; payload_type "wendycloud.v2.OpenRelaySessionRequest".
  rpc OpenRelaySession(SignedRequest) returns (OpenRelaySessionResponse) {
    option (wendy.signed_request) = true;
  }
  // The session's single stream, authenticated like OpenRelaySession (same
  // token rules, unsigned). The first request is `session_id`; the caller
  // must be the user who opened it, else PERMISSION_DENIED. A second
  // stream for the same session is refused with ALREADY_EXISTS. The session
  // ends, and every binding with it, when the stream ends (CLI exit, network
  // loss, the CLI closing it) or after 8 h without a forwarded frame. A
  // reconnecting CLI opens a new session. Liveness is HTTP/2 keepalive pings
  // sent by the relay; the path to the relay must not cap stream duration.
  // Bidirectional, so not signed (conformance/reqsig/README.md).
  rpc RelaySession(stream RelaySessionRequest) returns (stream RelaySessionResponse);
}

message OpenRelaySessionRequest {
  string organization_id = 1;
}

message OpenRelaySessionResponse {
  // Opaque, not a secret: it is audited on every call as `relay_session_id`.
  // Attaching needs the opener's own token as well.
  string session_id = 1;
  // At least 8 characters from a CSPRNG, shown by the CLI only. The user
  // gives it to the web chat; the relay binds a web client only when it
  // presents this code, and then asks the CLI (PairingRequested). The relay
  // ends the session after 5 wrong presentations.
  string pairing_code = 2;
  // Attach the stream before this (60 s after open) or the session ends.
  // Once attached the 8 h idle rule applies instead.
  google.protobuf.Timestamp expires_at = 3;
}

message RelaySessionRequest {
  oneof msg {
    // First message only.
    string session_id = 1;
    PairingDecision pairing_decision = 2;
    // A JSON-RPC message from the CLI to one bound web client (results,
    // errors, notifications).
    McpFrame frame = 3;
  }
}

message RelaySessionResponse {
  oneof msg {
    PairingRequested pairing_requested = 1;
    // A JSON-RPC message from one bound web client.
    McpFrame frame = 2;
  }
}

// A web client asks to bind. The relay sends it only after validating the
// client's bearer (sub and tenant_uuid equal the session's user and tenant) and its
// presented code. The CLI shows client_name, client_id and code so the user
// can match them to the chat, and accepts only on the user's confirmation.
message PairingRequested {
  // Relay-assigned; names the binding in PairingDecision and McpFrame.
  string binding_id = 1;
  // Display name from the client's OAuth client metadata.
  string client_name = 2;
  // The OAuth client_id the bearer was issued to (for ChatGPT and Claude, the
  // URL of their client ID metadata document). Becomes the
  // SignedRequest.mcp_client_id of this binding's calls.
  string client_id = 3;
  // The code the web client presented.
  string code = 4;
}

// The relay forwards frames for binding_id only after accept. A deny, or no
// decision, leaves the web client unbound. The CLI also drops any frame whose
// binding_id it has not accepted.
message PairingDecision {
  string binding_id = 1;
  bool accept = 2;
}

message McpFrame {
  // Per sender and session: starts at 1, increments by 1. A receiver ends the
  // stream on a gap or repeat. A consistency check only: the stream already
  // orders frames, and it is no defence against the relay.
  uint64 sequence = 1;
  string binding_id = 2;
  // One MCP JSON-RPC message, UTF-8 JSON, forwarded verbatim.
  bytes message = 3;
}
