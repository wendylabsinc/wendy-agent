// proto/pkicore/v1/engine.proto
syntax = "proto3";
package pkicore.v1;
option go_package = "github.com/wendylabsinc/service-protos/pkicore/v1;pkicorev1";
import "pkicore/v1/types.proto";

service CAEngine {
  rpc IssueCertificate(IssueCertificateRequest)   returns (IssueCertificateResponse);
  rpc RevokeCertificate(RevokeCertificateRequest) returns (RevokeCertificateResponse);
  rpc ListCertificates(ListCertificatesRequest)   returns (ListCertificatesResponse);
  rpc ListCertMetadata(ListCertMetadataRequest)   returns (ListCertMetadataResponse);
  rpc GetCRL(GetCRLRequest)                       returns (GetCRLResponse);
  rpc GetOCSP(GetOCSPRequest)                     returns (GetOCSPResponse);
  rpc CreateCustomerCA(CreateCustomerCARequest)   returns (CreateCustomerCAResponse);
  rpc RotateCA(RotateCARequest)                   returns (RotateCAResponse);
  rpc RevokeCA(RevokeCARequest)                   returns (RevokeCAResponse);
  rpc GetCAChain(GetCAChainRequest)               returns (GetCAChainResponse);
  rpc GetAuditLog(GetAuditLogRequest)             returns (stream AuditLogEntry);
  rpc GetCACerts(GetCACertsRequest)                          returns (GetCACertsResponse);
  rpc VerifyEABSignature(VerifyEABSignatureRequest) returns (VerifyEABSignatureResponse);
  rpc GetCertificate(GetCertificateRequest)         returns (GetCertificateResponse);

  // Management-plane RPCs (formerly the Admin REST API, Plan 16a; that REST
  // surface is retired — AAA W20). Fronted by FabricManagementService on the
  // private-only fabric, or by the `pkicore admin` CLI.
  rpc SetTenantPolicy(SetTenantPolicyRequest)           returns (SetTenantPolicyResponse);
  rpc GetTenantPolicy(GetTenantPolicyRequest)           returns (GetTenantPolicyResponse);
  rpc ListCAs(ListCAsRequest)                           returns (ListCAsResponse);
  rpc OffboardTenant(OffboardTenantRequest)             returns (OffboardTenantResponse);
  rpc CreateEABKey(CreateEABKeyRequest)                 returns (CreateEABKeyResponse);
  rpc ListEABKeys(ListEABKeysRequest)                   returns (ListEABKeysResponse);
  rpc RevokeEABKey(RevokeEABKeyRequest)                 returns (RevokeEABKeyResponse);
  rpc CreateEnrollmentToken(CreateEnrollmentTokenRequest) returns (CreateEnrollmentTokenResponse);
  rpc ListEnrollmentTokens(ListEnrollmentTokensRequest)   returns (ListEnrollmentTokensResponse);
  rpc RevokeEnrollmentToken(RevokeEnrollmentTokenRequest) returns (RevokeEnrollmentTokenResponse);
  rpc IssueOperatorCert(IssueOperatorCertRequest)       returns (IssueOperatorCertResponse);
  // LookupTenant resolves a tenant slug to its authoritative UUID identity.
  // Engine-internal today: the Admin REST route that used to front it is
  // retired (AAA W20) and it has no FabricManagementService front yet.
  rpc LookupTenant(LookupTenantRequest)                 returns (LookupTenantResponse);

  // Migration RPC (Plan 23 — PQ modular redesign §4.4).
  rpc MigrateCA(MigrateCARequest) returns (MigrateCAResponse);

  // --- Code-signing RPCs (Phase 4) ---

  // Sign-blob: server-held key signs a pre-computed digest, returns signature + chain.
  // Routed by /v1/sign/blob via the code-signing frontend.
  rpc SignBlob(SignBlobRequest) returns (SignBlobResponse);

  // RFC 3161 timestamp issuance. Routed by /v1/timestamp.
  rpc IssueTimestamp(IssueTimestampRequest) returns (IssueTimestampResponse);

  // MintTunnelAttestation atomically consumes the single-use §4.1 request nonce
  // and mints the tunnel principal attestation JWS (WDY-2708). Called by the
  // fabric TunnelPrincipalAttestationService after the edge has verified the
  // device signature and the §4.1 descriptor. Consume-then-mint is atomic and
  // at-most-once: a claimed nonce that then fails to mint is permanently burned.
  rpc MintTunnelAttestation(MintTunnelAttestationRequest) returns (MintTunnelAttestationResponse);

  // GetTunnelAttestationJWKS returns the tunnel principal attestation signing
  // JWKS (WDY-2708): the public halves of the dedicated ML-DSA-65 signer key(s),
  // as an application/json JWKS document, for the codesign public frontend to
  // serve at /.well-known/tunnel-attestation-jwks.json. Public keys only;
  // includes retired-but-not-yet-expired kids so in-flight attestations still
  // verify during rotation.
  rpc GetTunnelAttestationJWKS(GetTunnelAttestationJWKSRequest) returns (GetTunnelAttestationJWKSResponse);

  // Security event transmitter (WDY-3410): pki-core signs CAEP credential-change
  // (x509 revoke) SETs; see conformance/set/README.md. Every leaf revocation writes
  // a durable outbox row in the same transaction. The engine has no internet
  // egress, so the fabric frontend drains the outbox and pushes to the receivers.
  //
  // GetSecurityEventJWKS returns the public halves of the dedicated ML-DSA-65 SET
  // signing key(s) as a JWKS document. The codesign public frontend serves it at
  // <issuer>/.well-known/ssf-jwks.json.
  rpc GetSecurityEventJWKS(GetSecurityEventJWKSRequest) returns (GetSecurityEventJWKSResponse);
  // ClaimSecurityEvents leases up to `limit` due outbox rows (lease = the row's
  // next retry time) and returns each as a freshly signed SET: fresh iat/exp,
  // stable jti. A crashed caller loses nothing; the lease runs out and the row is
  // claimed again. Receivers dedup on jti.
  rpc ClaimSecurityEvents(ClaimSecurityEventsRequest) returns (ClaimSecurityEventsResponse);
  // AckSecurityEvent records one push outcome: delivered marks the row done, and
  // anything else is audited and retried with capped backoff. Rows are never dropped.
  rpc AckSecurityEvent(AckSecurityEventRequest) returns (AckSecurityEventResponse);

  // CA lifecycle (admin-API):
  rpc BootstrapPlatformCodeSigningRoot(BootstrapPlatformCodeSigningRootRequest)   returns (BootstrapPlatformCodeSigningRootResponse);
  rpc ProvisionPlatformCodeSigningActive(ProvisionPlatformCodeSigningActiveRequest) returns (ProvisionPlatformCodeSigningActiveResponse);
  rpc BootstrapPlatformTSA(BootstrapPlatformTSARequest)                           returns (BootstrapPlatformTSAResponse);
  rpc AttachCodeSigningCA(AttachCodeSigningCARequest)                             returns (AttachCodeSigningCAResponse);

  // Signer lifecycle (admin-API):
  rpc CreateCodeSigningSigner(CreateCodeSigningSignerRequest)                     returns (CreateCodeSigningSignerResponse);
  rpc RetireCodeSigningSigner(RetireCodeSigningSignerRequest)                     returns (RetireCodeSigningSignerResponse);
  rpc ListCodeSigningSigners(ListCodeSigningSignersRequest)                       returns (ListCodeSigningSignersResponse);

  // Tenant rules (admin-API):
  rpc CreateCodeSigningRule(CreateCodeSigningRuleRequest)                         returns (CreateCodeSigningRuleResponse);
  rpc UpdateCodeSigningRule(UpdateCodeSigningRuleRequest)                         returns (UpdateCodeSigningRuleResponse);
  rpc DeleteCodeSigningRule(DeleteCodeSigningRuleRequest)                         returns (DeleteCodeSigningRuleResponse);
  rpc ListCodeSigningRules(ListCodeSigningRulesRequest)                           returns (ListCodeSigningRulesResponse);

  // Durable denial audit: the code-signing frontend rejects most requests
  // before any other RPC fires, so it records those denials via this RPC into
  // the engine's hash-chained audit_log (action "code-sign.deny"), scoped to
  // the resolved tenant.
  rpc RecordCodeSignDenial(RecordCodeSignDenialRequest)                           returns (RecordCodeSignDenialResponse);

  // ACME account standing (WDY-3497). Before serving a kid-signed request the
  // ACME frontend asks whether the account's lineage still stands. It does
  // not when the account's latest leaf is revoked (RevokeByPrincipal, the
  // principal-disable cascade, OffboardTenant, revoke-cert), its principal is
  // disabled, the tenant is not active, or the latest leaf has expired on an
  // account that does not re-attest each order. The frontend then marks the
  // account revoked. The engine writes one audit row per revoked verdict.
  rpc CheckACMEAccount(CheckACMEAccountRequest)                                   returns (CheckACMEAccountResponse);

  // SSF/CAEP receiver relay (AAA contract §6). The private-only fabric frontend
  // verifies an inbound wendyauth.v1 security-event token (RISC
  // account-disabled / account-purged, CAEP session-revoked) against the realm
  // JWKS, then relays the already-verified fact to the key-holding engine over
  // the internal hop via this RPC. For account-disabled / account-purged the
  // engine idempotently records the disabled principal (keyed on the SET jti)
  // and drives the renewal-refusal gate. session-revoked (WDY-3448) is audit
  // only: one ssf.session_revoked row, no disable, no revocation. Any other
  // event_type is refused. Fail-safe / revoke-only: it only ever removes a
  // principal's ability to renew, never grants.
  rpc RecordPrincipalDisable(RecordPrincipalDisableRequest)                       returns (RecordPrincipalDisableResponse);

  // SSF/CAEP tenant-lifecycle receiver relay (AAA contract §5.9/§6, WDY-3177).
  // Realm-scoped sibling of RecordPrincipalDisable, for the tenant-deleted event.
  // The private-only fabric frontend verifies an inbound wendyauth.v1
  // tenant-deleted SET — issued by the SYSTEM realm (iss=.../realms/system),
  // subject a bare tenant URI spiffe://wendy.sh/tenant/<uuid> — against the
  // system-realm JWKS, then relays the already-verified fact to the key-holding
  // engine over the internal hop via this RPC (a fabric-surface / SurfaceFabric
  // engine-internal call, never operator-facing, like the SSF relays above).
  // The system-signed SET is the SOLE authority: there is no operator signature,
  // so this path does NOT run the operator-signed OffboardTenant management gate.
  // The engine idempotently offboards the tenant (keyed on the SET jti) via the
  // existing OffboardTenant semantics — revoke the tenant's CAs, mark it
  // offboarded, retain audit rows (WDY-3177 v1: delete nothing). Fail-safe /
  // revoke-only. The raw SET is never relayed, persisted, or logged.
  rpc RecordTenantDeleted(RecordTenantDeletedRequest)                             returns (RecordTenantDeletedResponse);

  // Tenant disable / enable relay (WDY-3543). Sibling of RecordTenantDeleted for
  // the system-realm-signed tenant-disabled and tenant-enabled SETs (realm
  // disabled / re-enabled in wendy-auth). disabled stops all issuance and
  // renewal for the tenant; certificates, CAs and CRLs stay as they are.
  // enabled reverses a disable and nothing else: it never reactivates an
  // offboarded tenant. The engine applies a change only when event_time is
  // newer than the last one it applied, so a late retry cannot undo a newer
  // change. Replayed jti, offboarded or unknown tenant: no change, one audit
  // row. Any other event_type is refused.
  rpc RecordTenantLifecycle(RecordTenantLifecycleRequest)                         returns (RecordTenantLifecycleResponse);

  // Enrollment-token revoke relay (AAA contract §5.4, W18). The private-only
  // fabric frontend verifies an inbound cloud-origin token-revoke security-event
  // token (cloud KMS signer — a distinct trust domain from the realm-signed
  // account-disabled/purged SETs above), then relays the already-verified fact
  // to the key-holding engine over the internal hop via this RPC. The engine
  // idempotently records the revocation (keyed on token_kind+token_ref and on
  // source_jti); EST/ACME enrollment-token redemption (EAB and bootstrap) then
  // refuses the revoked token. Fail-safe / revoke-only: it only ever removes a
  // token's ability to be redeemed, never grants.
  rpc RecordEnrollmentTokenRevoke(RecordEnrollmentTokenRevokeRequest)             returns (RecordEnrollmentTokenRevokeResponse);

  // Cloud grant-issuer JWKS relay (WDY-2929). The engine verifies cloud grants
  // against the issuer's rotating JWKS, but the engine has NO route to the
  // public internet by design — it sits in a private VPC reached only over PSC,
  // and WDY-2864 removes the last path out. The private-only fabric frontend,
  // which already fetches the realm JWKS for the SET relay above, fetches the
  // grant issuer's JWKS too and relays the document here.
  //
  // This moves KEY DISTRIBUTION only. Every policy decision stays in the
  // engine: signature verification, CSR-key thumbprint binding, tenant match,
  // lifetime binding and the entitlement cap chain (grant is subset of tenant
  // ceiling is subset of platform cap) all run engine-side against engine
  // state, exactly as before. The fabric relays keys, never a verdict — which
  // is the smallest trust delta that removes the egress.
  //
  // The engine stamps its OWN receipt time rather than trusting a timestamp in
  // the request, and refuses grant verification once the freshest accepted
  // document is older than its staleness horizon: fail CLOSED, so a fabric that
  // stops pushing degrades grant-bearing issuance rather than silently serving
  // keys that may have been rotated away. Ordinary issuance is unaffected —
  // the grant path is only entered when a request actually carries a grant.
  rpc RecordGrantJWKS(RecordGrantJWKSRequest)                                     returns (RecordGrantJWKSResponse);

  // Postbox head notarization (AAA contract §5.3 / D8, W8). pki-core holds NO
  // postbox — the log is cloud's. This RPC notarizes a head cloud ASSERTS,
  // binding it to pki-core's own clock inside an RFC 3161-timestamped
  // checkpoint. The engine keeps a per-(tenant,target) watermark and REFUSES a
  // head below it (rollback) or a different head at the same id (fork), and
  // refuses while an operator submission receipt has gone unacknowledged past
  // the configured grace window (withholding). Fail-safe: it only ever attests
  // or refuses.
  rpc NotarizePostboxHead(NotarizePostboxHeadRequest)                             returns (NotarizePostboxHeadResponse);

  // Submission-receipt intake (AAA contract §10 item 4, W8). The §5.3 frontend
  // verifies an operator-signed change request posted DIRECTLY by operator
  // tooling — a second ingestion path cloud does not control — and relays the
  // extracted fact here. The raw signed request is never relayed, persisted, or
  // logged; only its SHA-256 and the verified principal. Idempotent on
  // (tenant, request_hash, target).
  rpc RecordChangeRequestReceipt(RecordChangeRequestReceiptRequest)               returns (RecordChangeRequestReceiptResponse);

  // Device freshness view (AAA contract §5.3, W8): the latest notarized
  // checkpoint for a target plus the receipt lower bound pki-core holds
  // independently of cloud. Serving this from pki-core is what takes cloud out
  // of the checkpoint-delivery path.
  rpc GetPostboxFreshness(GetPostboxFreshnessRequest)                             returns (GetPostboxFreshnessResponse);

  // Unified X.509 renewal (AAA contract §5.2/§5.4, W3). "Renewal is a PKI
  // operation, not a new authorization": renewability is authorized once at
  // first issuance and renewals go direct to pki-core. This is the dedicated
  // renewal operation for the direct X.509 renewal frontend (operator/service
  // identity + direct device renewal + the D14 grant-accept path); device
  // ACME/EST re-enroll continue to run the SAME shared renewal gate via
  // IssueCertificate's device-cert branch. The distinct RenewOutcome (esp.
  // NEEDS_GRANT for the D14 post-expiry seam) is why renewal has its own RPC
  // rather than reusing IssueCertificate's response.
  rpc RenewCertificate(RenewCertificateRequest)                                   returns (RenewCertificateResponse);

  // Over-duration issuance (four-eyes). A request whose validity exceeds the
  // tenant ceiling is held pending a second operator signature rather than
  // rejected. Authority is the SIGNED envelope, never the transport (D7).
  rpc RequestOverDurationIssuance(RequestOverDurationIssuanceRequest)         returns (RequestOverDurationIssuanceResponse);
  rpc ApproveOverDurationIssuance(ApproveOverDurationIssuanceRequest)         returns (ApproveOverDurationIssuanceResponse);

  // Collection of an over-duration issuance. The certificate is minted HERE,
  // at pickup, for EVERY outcome — a request within the tenant ceiling is
  // auto-approved (it needed no second signature) and waits here like any
  // other, rather than being minted inline at submit.
  //
  // Uniform on purpose: cloud must never have to know pki-core's duration
  // ceiling, and must never branch on outcome to find its collection handle.
  // One path always — submit, read collection_id, collect. The extra round
  // trip lands only on MINTED, which on THIS endpoint means a caller who did
  // not need four-eyes and arguably should have used ordinary issuance; the
  // common four-eyes path pays nothing for the uniformity.
  //
  // Because nothing mints before pickup, no issued-but-undelivered certificate
  // ever sits at rest: an uncollected request is only an uncollected
  // authorization, reaped by the existing sweeper.
  //
  // NOT IDEMPOTENT (WDY-2728). A second pickup is REFUSED, never replayed.
  // No minted certificate is stored at rest anywhere in this flow — migration
  // 021 dropped certificate_ledger.certificate and the ledger row carries
  // metadata only — so there are no bytes to re-serve. A "replay" could
  // therefore only RE-MINT: a second certificate, with a new serial and a new
  // (shorter) validity, issued under a single approval. That breaks
  // one-approval-one-certificate, which is the entire accountability claim
  // four-eyes makes, so replay is impossible by construction rather than
  // merely refused.
  //
  // The mint and the approved->consumed transition share one transaction, so
  // one approval yields at most one certificate and two concurrent pickups
  // serialize on the row. A repeat is AlreadyExists.
  //
  // A transport failure on this RPC is therefore NOT retryable: a response lost
  // in transit costs the collector a second four-eyes ceremony. That price is
  // deliberate — the alternatives are storing minted certificates at rest, or
  // issuing two certificates for one approval.
  rpc PickupOverDurationCertificate(PickupOverDurationCertificateRequest)     returns (PickupOverDurationCertificateResponse);
  rpc ListPendingOverDurationRequests(ListPendingOverDurationRequestsRequest) returns (ListPendingOverDurationRequestsResponse);
  rpc GetPendingOverDurationRequest(GetPendingOverDurationRequestRequest)     returns (GetPendingOverDurationRequestResponse);
  // Refuses a pending over-duration request before it expires (WDY-3409).
  // Mints nothing and records nothing but the denial; the request moves to a
  // terminal state and can no longer be approved or collected. Authority is
  // the operator-signed management request (op "deny_over_duration") plus
  // signed_rights; the transport grants nothing.
  rpc DenyOverDurationIssuance(DenyOverDurationIssuanceRequest)               returns (DenyOverDurationIssuanceResponse);

  // Revokes every live (unexpired, unrevoked) leaf whose SPIFFE principal is
  // exactly `principal`, in the authenticated tenant only (WDY-3409). The
  // operator-facing face of the cascade the SSF account-disabled/purged path
  // already runs; the member stays a member. Authority is the operator-signed
  // management request (op "revoke_principal") plus signed_rights.
  rpc RevokeByPrincipal(RevokeByPrincipalRequest)                             returns (RevokeByPrincipalResponse);

  // Operator-authority status (WDY-2217). Answers "has this operator leaf's
  // authority been withdrawn?" from the revocation state pki-core ALREADY owns
  // — the certificate_ledger revoked_at column and the SSF-driven
  // disabled_principals kill switch — so the fabric edge (a separate process
  // that holds no database) can enforce operator revocation on its
  // highest-authority paths without fetching or trusting a published CRL.
  //
  // Deliberately NOT a CRL/OCSP fetch: operator authority must not depend on a
  // CDN being reachable or a CRL being fresh, and a revocation recorded here
  // takes effect on the NEXT request rather than at the next CRL publish. The
  // caller already cannot be served without the engine, so a failed lookup is
  // the same dependency the request already has.
  //
  // Read-only and side-effect free; it grants nothing. The engine derives the
  // tenant, fingerprint and principal from the presented leaf itself and
  // requires the derived tenant to equal the authenticated one.
  rpc CheckOperatorAuthority(CheckOperatorAuthorityRequest) returns (CheckOperatorAuthorityResponse);

  // Full operator-leaf validity verdict — the engine half of
  // FabricManagementService.ValidateOperatorCertificate (see
  // fabric_management.proto for the cloud-facing rationale). A superset of
  // CheckOperatorAuthority: on top of the ledger/disabled-principals lookup it
  // verifies the leaf chains to the authenticated tenant's Operator-Authority
  // CA, is inside its validity window, and carries an operator SPIFFE
  // principal of that tenant. Same posture as CheckOperatorAuthority:
  // read-only, side-effect free, grants nothing; every derivation (chain,
  // SAN, fingerprint) is performed engine-side from the presented leaf, and
  // the derived tenant must equal the authenticated one.
  rpc ValidateOperatorCertificate(ValidateOperatorCertificateRequest) returns (ValidateOperatorCertificateResponse);
}

message IssueCertificateRequest {
  string      ca_id             = 1;
  bytes       csr               = 2; // DER PKCS#10
  string      profile           = 3;
  AuthContext auth              = 4;
  repeated Extension extra_extensions = 5;
  // Per-request override of the leaf algorithm (registry name, e.g.
  // "ECDSA_P384" or "ML_DSA_65"). Controls leaf keypair only — must agree
  // with the CSR's SubjectPublicKeyInfo when a CSR is supplied.
  optional string leaf_algorithm = 6;
  // W9: raw cloud-signed authorization grant (compact JWS, kind
  // "cloud-grant+jws"). When present, the engine re-verifies it (D7) and mints
  // an entitlement-bearing cert gated by the grant. Empty => ordinary issuance.
  bytes grant = 7;
}

message IssueCertificateResponse {
  bytes certificate = 1; // DER leaf
  bytes chain       = 2; // DER intermediates (not root)
  bytes ocsp_staple = 3; // pre-generated OCSP response for offline carry
}

message RevokeCertificateRequest {
  string ca_id  = 1;
  bytes  serial = 2;
  int32  reason = 3; // RFC 5280 reason code
  // WDY-3409: the operator's management-request JWS (op "revoke_certificate"),
  // relayed verbatim from Envelope.signed_artifact. The engine verifies it and
  // takes ca_id/serial/reason and the single-use jti from its payload; the
  // unsigned fields above must match. Empty on the admin path.
  bytes signed_request = 4;
  // WDY-3409: cloud-signed rights attestation ("cloud-rights+jws") that the
  // signing operator holds pki:cert-revoke now. Same shape and verification as
  // ApproveOverDurationIssuanceRequest.signed_rights.
  bytes signed_rights = 5;
}
message RevokeCertificateResponse {}

message ListCertificatesRequest {
  string ca_id      = 1;
  string page_token = 2;
  int32  page_size  = 3;
}
message ListCertificatesResponse {
  repeated bytes certificates = 1;
  string         next_page_token = 2;
}

message ListCertMetadataRequest {
  string tenant_id  = 1; // injected from gRPC metadata x-tenant-id
  int32  page_size  = 2;
  string page_token = 3; // opaque; hex serial of the last row from the previous page
  // W20/WDY-2216: originating tier-3 management-request jti; when set the engine
  // enforces single-use of the signed request (empty on the admin path => no
  // replay check). Same posture as RotateCARequest.source_jti.
  string source_jti = 4;
  // WDY-3409 filters; empty/UNSPECIFIED = no filter, all set filters AND.
  // On the fabric they are read from the signed management request, like
  // page_size/page_token.
  string   principal     = 5; // exact SPIFFE URI SAN
  string   status_filter = 6; // "active" | "revoked" | "expired" | "" (all)
  CertType cert_type     = 7;
  bytes    serial        = 8; // exact serial: a single-certificate read
}

// CertType is derived by pki-core from the leaf's SPIFFE principal kind
// (WDY-3409). UNSPECIFIED = any other leaf (no SAN, code signing, TSA, ...).
enum CertType {
  CERT_TYPE_UNSPECIFIED = 0;
  CERT_TYPE_OPERATOR    = 1;
  CERT_TYPE_DEVICE      = 2;
  CERT_TYPE_SERVICE     = 3;
}

message CertMetadata {
  bytes  serial      = 1;
  string principal   = 2; // SPIFFE URI SAN ("" when the leaf had none)
  string status      = 3; // "active" | "revoked" | "expired"
  string expires_at  = 4; // RFC3339
  bytes  fingerprint = 5; // SHA-256 of the leaf DER
  int32  revoke_reason = 6; // RFC 5280; 0 and status!="revoked" ⇒ not revoked
  // WDY-3409: inventory fields.
  string   ca_id      = 7;  // issuing CA
  string   profile    = 8;  // issuance profile name
  string   issued_at  = 9;  // RFC3339
  string   not_before = 10; // RFC3339, from the leaf
  CertType cert_type  = 11;
}
message ListCertMetadataResponse {
  repeated CertMetadata items           = 1;
  string                next_page_token = 2;
}

message GetCRLRequest {
  string ca_id = 1;
  bool   delta = 2;
}
message GetCRLResponse {
  bytes  crl         = 1; // DER
  string this_update = 2; // RFC3339
  string next_update = 3; // RFC3339
}

message GetOCSPRequest  { bytes serial = 1; }
message GetOCSPResponse { bytes response = 1; }

message CreateCustomerCARequest {
  string       tenant_id = 1;
  string       label     = 2;
  // Deprecated: superseded by algorithm_name. The legacy enum only covered
  // ML-DSA + ECDSA_P384; new callers should set algorithm_name + backend.
  KeyAlgorithm algorithm = 3 [deprecated = true];
  bytes        policy    = 4; // optional JSON-encoded TenantPolicy; stored atomically
  // Registry algorithm name (e.g. "ECDSA_P384", "ML_DSA_65"). Overrides the
  // tenant default for the intermediate role. Empty falls back to algorithm.
  optional string algorithm_name = 5;
  // Registry backend name (e.g. "software", "cloudkms"). Overrides the
  // tenant default for the intermediate role. Empty falls back to platform
  // default.
  optional string backend = 6;
  // WDY-2620: tenant UUID minted by the cloud control plane; the engine adopts
  // it as the authoritative tenant identity instead of minting its own. Empty
  // falls back to an engine-minted UUID. The nil UUID is reserved for the
  // system tenant and is rejected here. tenant_id above stays the human slug.
  string tenant_uuid = 7;
}
message CreateCustomerCAResponse {
  string intermediate_ca_id = 1;
  string device_ca_id       = 2;
  string operator_ca_id     = 3;
  bytes  intermediate_cert  = 4; // DER
  // Echo of the adopted tenant UUID: the request tenant_uuid when the caller
  // minted one, otherwise the UUID the engine minted. The request tenant_id is
  // the caller-supplied slug; this is the authoritative tenant identity the
  // management plane and clients address the tenant by.
  string tenant_id          = 5;
}

message LookupTenantRequest  { string slug = 1; }
message LookupTenantResponse {
  string tenant_id = 1; // canonical UUID
  string slug      = 2;
  string label     = 3;
  string status    = 4; // "active" | "offboarded"
}

// W20: source_jti = originating management-request jti; when set the engine enforces single-use of the signed request (empty on the admin path => no replay check).
message RotateCARequest  {
  string ca_id = 1;
  string source_jti = 2;
  // false ⇒ soft-drain (predecessor → active_revocation_only); true ⇒ immediate full revoke (compromise cutover).
  bool hard = 3;
}
message RotateCAResponse { string new_ca_id = 1; bytes new_cert = 2; }

message RevokeCARequest  { string ca_id = 1; int32 reason = 2; }
message RevokeCAResponse {}

message GetCAChainRequest  { string ca_id = 1; }
message GetCAChainResponse { repeated bytes chain = 1; } // leaf CA → root

message GetAuditLogRequest {
  string tenant_id  = 1;
  string since      = 2; // RFC3339
  string resource   = 3;
  int32  page_size  = 4;
  string page_token = 5;
  // W20/WDY-2216: originating tier-3 management-request jti; single-use enforced
  // by the engine when set (empty on the admin path => no replay check).
  string source_jti = 6;
  // WDY-3508 (expand phase). On the fabric both are read from the signed
  // management request (op "get_audit_log"), like page_size/page_token, and
  // copied here; the engine applies them. Unset = today's behaviour.
  // before_id: when non-zero, only rows with id < before_id
  // (AuditLogEntry.id). The newest-first cursor: pass the last entry's id.
  int64         before_id = 7;
  AuditLogOrder order     = 8;
}

enum AuditLogOrder {
  AUDIT_LOG_ORDER_UNSPECIFIED = 0; // = ASC, the pre-WDY-3508 behaviour
  AUDIT_LOG_ORDER_ASC         = 1; // oldest first, by id
  AUDIT_LOG_ORDER_DESC        = 2; // newest first, by id
}

// GetCACerts returns all active CA certificates for the authenticated tenant.
// Tenant is taken from x-tenant-id gRPC metadata. Used by the EST cacerts endpoint.
message GetCACertsRequest {}
message GetCACertsResponse {
  repeated bytes certs = 1; // DER-encoded CA certificates (root → device CA order)
}

message VerifyEABSignatureRequest {
  string tenant_id = 1;
  string key_id    = 2;
  bytes  message   = 3; // base64url(protected) + "." + base64url(payload)
  bytes  mac       = 4; // raw HMAC-SHA256 bytes
}

message VerifyEABSignatureResponse {
  bool   valid                = 1;
  string ca_id                = 2;
  string profile              = 3;
  bool   attestation_required = 4;
  string device_id            = 5;
}

// --- Tenant policy ---

message SetTenantPolicyRequest {
  string tenant_id = 1; // injected from gRPC metadata x-tenant-id
  bytes  policy    = 2; // JSON-encoded store.TenantPolicy
  // W20/WDY-2216: originating tier-3 management-request jti; single-use enforced
  // by the engine when set (empty on the admin path => no replay check).
  string source_jti = 3;
}
message SetTenantPolicyResponse {}

message GetTenantPolicyRequest {
  string tenant_id = 1; // injected from gRPC metadata x-tenant-id
}
message GetTenantPolicyResponse {
  bytes policy = 1; // JSON-encoded store.TenantPolicy; empty if none set
}

// --- CA listing ---

message ListCAsRequest {
  string tenant_id = 1; // injected from gRPC metadata x-tenant-id
}

// CARole is the structured role/kind of a CA, so consumers no longer infer it
// from the label suffix (WDY-3144, follow-up from WDY-3114). pki-core is the
// producer and populates this from its CA creation record, NEVER from label
// text — the label stays only as a human-readable name.
//
// The tenant tier is three distinct CAs that pki-core creates for distinct
// purposes; today only the label carries which is which. pki-core's own
// ca_role column leaves tenant CAs empty/NULL, so these three values are the
// structured form of that per-tenant creation intent, not new roles.
enum CARole {
  // Never emitted by pki-core: the role was not set (e.g. an old producer).
  // This is NOT the marker for a tenant CA — those carry an explicit
  // CA_ROLE_TENANT_* value below.
  CA_ROLE_UNSPECIFIED = 0;

  // Tenant tier (per-tenant CAs; pki-core's empty/NULL ca_role today).
  CA_ROLE_TENANT_INTERMEDIATE       = 1;
  CA_ROLE_TENANT_DEVICE_IDENTITY    = 2;
  CA_ROLE_TENANT_OPERATOR_AUTHORITY = 3;

  // Platform tier (pki-core's ca_role string constants).
  CA_ROLE_ROOT                  = 4; // "root"
  CA_ROLE_CUSTOMER_INTERMEDIATE = 5; // "customer_intermediate"
  CA_ROLE_CODE_SIGNING_CA       = 6; // "code_signing_ca"
  CA_ROLE_TSA                   = 7; // "tsa"

  // Code-signing markers (WDY-3151 item 9), appended out of tier order to keep
  // the numbers above wire-stable. The platform Code-Signing Active CA and the
  // per-tenant Code-Signing CA carried no ca_role and were told apart only by
  // their label suffixes until pki-core began stamping ca_role at creation and
  // backfilled pre-existing rows. CA_ROLE_CODE_SIGNING_ACTIVE is platform-tier
  // (tenant="system"); CA_ROLE_TENANT_CODE_SIGNING is tenant-tier.
  CA_ROLE_TENANT_CODE_SIGNING = 8; // "tenant_code_signing"
  CA_ROLE_CODE_SIGNING_ACTIVE = 9; // "code_signing_active"
}

message CAInfo {
  string ca_id       = 1;
  string label       = 2;
  // pki-core passes ca_hierarchy.status through verbatim (migration 034 check
  // constraint): "active_issuing" | "active_revocation_only" | "retired" |
  // "revoked" | "expired" | "pending_import". A never-rotated CA is
  // "active_issuing". WDY-3114.
  string status      = 3;
  string not_after   = 4;  // RFC3339
  bytes  certificate = 5; // DER
  CARole role        = 6;  // WDY-3144; UNSPECIFIED until pki-core populates it (hop 2)
  // WDY-3409: revocation publishing status. Empty when the CA publishes no
  // CRL (e.g. the offline root).
  string crl_url         = 7; // e.g. https://crl.pki.wendy.dev/<ca_id>/crl.der
  string crl_this_update = 8; // RFC3339, last full CRL publish
  string crl_next_update = 9; // RFC3339, next scheduled full CRL publish
  string ocsp_url        = 10;
}
message ListCAsResponse {
  repeated CAInfo cas = 1;
}

// --- Offboarding ---

message OffboardTenantRequest {
  string tenant_id = 1; // injected from gRPC metadata x-tenant-id
  // W20/WDY-2216: originating tier-3 management-request jti; single-use enforced
  // by the engine when set (empty on the admin path => no replay check).
  string source_jti = 2;
}
message OffboardTenantResponse {}

// --- EAB key management ---

message CreateEABKeyRequest {
  string tenant_id            = 1; // injected from gRPC metadata x-tenant-id
  string ca_id                = 2;
  string device_id            = 3;
  string profile              = 4;
  bool   attestation_required = 5;
  // W18: originating enrollment-request jti; when set the engine enforces single-use of the signed request (empty on the admin path => no replay check).
  string source_jti           = 6;
  // WDY-3541: optional operator-chosen display name (UTF-8, at most 128
  // characters). On the relay path the fabric copies it from the operator's
  // signed enrollment request ("label" claim), never from unsigned input.
  string label                = 7;
}
message CreateEABKeyResponse {
  string key_id   = 1;
  string hmac_key = 2; // hex-encoded raw HMAC key (returned once only)
}

message ListEABKeysRequest {
  string tenant_id     = 1; // injected from gRPC metadata x-tenant-id
  int32  page_size     = 2;
  string page_token    = 3; // UUID of last key from previous page
  string status_filter = 4; // "active" | "consumed" | "revoked" | "" (all)
}
message EABKeyInfo {
  string key_id                = 1;
  string ca_id                 = 2;
  string device_id             = 3;
  string profile               = 4;
  bool   attestation_required  = 5;
  string status                = 6;
  string created_at            = 7; // RFC3339
  // WDY-3541. Empty for keys created before pki-core stored these.
  string label                 = 8;
  // Tenant SPIFFE URI of the operator whose verified signed request created
  // the key; empty when the creator was not a verified principal (admin path).
  string created_by            = 9;
  string revoked_at            = 10; // RFC3339; empty unless status is "revoked"
}
message ListEABKeysResponse {
  repeated EABKeyInfo keys            = 1;
  string              next_page_token = 2;
}

message RevokeEABKeyRequest {
  string tenant_id = 1; // injected from gRPC metadata x-tenant-id
  string key_id    = 2;
}
message RevokeEABKeyResponse {}

// --- Enrollment token management ---

message CreateEnrollmentTokenRequest {
  string tenant_id   = 1; // injected from gRPC metadata x-tenant-id
  string ca_id       = 2;
  string device_id   = 3;
  string profile     = 4;
  int64  ttl_seconds = 5;
  // W18: originating enrollment-request jti; when set the engine enforces single-use of the signed request (empty on the admin path => no replay check).
  string source_jti  = 6;
  // WDY-3541: optional display name; same rules as CreateEABKeyRequest.label.
  string label       = 7;
}
message CreateEnrollmentTokenResponse {
  string token_id    = 1;
  string token_value = 2; // plaintext token (returned once only)
  string expires_at  = 3; // RFC3339
}

message ListEnrollmentTokensRequest {
  string tenant_id     = 1; // injected from gRPC metadata x-tenant-id
  int32  page_size     = 2;
  string page_token    = 3; // UUID of last token from previous page
  bool   show_consumed = 4; // if false (default) show only unused non-revoked tokens
}
message EnrollmentTokenInfo {
  string token_id   = 1;
  string device_id  = 2;
  string profile    = 3;
  string expires_at = 4; // RFC3339
  // True only once the token was redeemed. A revoked, never-used token has
  // consumed = false and revoked_at set: read revoked_at before consumed.
  bool   consumed   = 5;
  string created_at = 6; // RFC3339
  // WDY-3541: label and created_by as on EABKeyInfo.
  string label      = 7;
  string created_by = 8;
  string revoked_at = 9; // RFC3339; empty unless revoked
}
message ListEnrollmentTokensResponse {
  repeated EnrollmentTokenInfo tokens         = 1;
  string                       next_page_token = 2;
}

message RevokeEnrollmentTokenRequest {
  string tenant_id = 1; // injected from gRPC metadata x-tenant-id
  string token_id  = 2;
}
message RevokeEnrollmentTokenResponse {}

// --- Operator cert issuance ---

message IssueOperatorCertRequest {
  string          tenant_id     = 1; // injected from gRPC metadata x-tenant-id
  string          subject_cn    = 2;
  string          subject_email = 3;
  repeated string entitlements  = 4;
  int64           ttl_seconds   = 5;
  // RETIRED. field_mode used to raise this request's TTL ceiling on a single
  // signature (8h -> 72h). That escalation is superseded by the four-eyes
  // over-duration flow (RequestOverDurationIssuance /
  // ApproveOverDurationIssuance), so pki-core no longer honors it.
  //
  // Kept in place, rather than deleted-and-reserved, because deleting a field
  // trips this repo's `buf breaking` policy. pki-core REJECTS a request that
  // sets it (InvalidArgument) instead of silently ignoring it — a client
  // still asking for field_mode is asking for an escalation that no longer
  // exists, and should be told so rather than quietly handed a short cert.
  bool            field_mode    = 6 [deprecated = true];
  bytes           csr           = 7; // optional DER PKCS#10; if empty engine generates keypair
  string          operator_id   = 8; // authoritative per-operator identity; SPIFFE path segment; renewal-safe (not uniqueness-enforced)
  string          spiffe_kind   = 9; // "operator" (default/empty) or "service"; server-selected SPIFFE kind
  // DPoP-proof single-use replay guard (WDY-2592). The identity frontend is a
  // stateless engine-RPC client with no database of its own, so it forwards
  // the enrollment DPoP proof's jti here and the engine claims it atomically
  // with issuance (first-seen-wins) against the dpop_replay cache. Empty =>
  // no replay check (e.g. the admin/CLI path with no DPoP proof). dpop_exp is
  // the proof's expiry (unix seconds), bounding the replay-cache row's TTL.
  string          dpop_jti      = 10;
  int64           dpop_exp      = 11;
}
message IssueOperatorCertResponse {
  bytes certificate = 1; // DER leaf
  bytes chain       = 2; // DER intermediates
  reserved 3;            // W12: was private_key; server never returns a key
  reserved "private_key";
  bytes ocsp_staple = 4;
}

message GetCertificateRequest  { bytes serial = 1; }
message GetCertificateResponse { bytes certificate = 1; } // DER leaf

// --- Migration (Plan 23 §4.4) ---

// MigrateCA creates a successor CA under a new (algorithm, backend) pair.
// The successor CA is signed by the same parent (or self-signs for roots);
// the predecessor CA is left active for issuance until its TTL elapses, at
// which point an external reaper revokes it. Both algorithm and backend are
// required — empty values are rejected.
message MigrateCARequest {
  string ca_id     = 1;
  string algorithm = 2; // registry name, required
  string backend   = 3; // registry name, required
  // W20: originating management-request jti; when set the engine enforces single-use of the signed request (empty on the admin path => no replay check).
  string source_jti = 4;
}

message MigrateCAResponse {
  string successor_ca_id = 1;
  bytes  certificate     = 2; // DER of the successor CA
}

// --- Code-signing messages (Phase 4) ---

message SignBlobRequest {
  string tenant_id          = 1; // "system" for platform signers
  string signer_id          = 2; // UUID of code_signing_signers row
  bytes  digest             = 3; // hex-decoded bytes
  string digest_alg         = 4; // "sha256" | "sha384" | "sha512"
  bool   request_timestamp  = 5;
  string request_id         = 6; // server-generated UUID for correlation
}
message SignBlobResponse {
  bytes  signature       = 1;
  string signature_alg   = 2; // e.g. "ECDSA_P256_SHA256", "ML_DSA_65"
  bytes  signer_cert     = 3; // DER
  repeated bytes chain   = 4; // DER intermediates (parent CA → next-up; root excluded)
  bytes  timestamp_token = 5; // optional, DER RFC 3161 TimeStampResp; empty if not requested
}

message IssueTimestampRequest {
  bytes  tsr_request = 1; // DER RFC 3161 TimeStampReq
  string tenant_id   = 2; // for audit; "system" for platform signers
  string request_id  = 3;
}
message IssueTimestampResponse {
  bytes tsr_response = 1; // DER RFC 3161 TimeStampResp
}

message MintTunnelAttestationRequest {
  string tenant_id            = 1; // injected from gRPC metadata x-tenant-id
  string correlation_id       = 2; // Envelope.correlation_id, for audit
  string nonce                = 3; // §4.1 descriptor nonce; single-use claim key
  string broker_audience      = 4; // AttestTunnelPrincipalRequest.broker_audience -> aud claim
  bytes  request_hash         = 5; // SHA-256 of the raw decoded request-JWS payload segment
  bytes  caller_key_binding   = 6; // SHA-256 of caller_signing_public_key_spki_der
  int64  requested_not_before = 7; // descriptor iat, unix seconds
  int64  requested_not_after  = 8; // descriptor expiry, unix seconds
}
message MintTunnelAttestationResponse {
  bytes  attestation_jws = 1; // compact ML-DSA-65 JWS, typ "tunnel-principal-attestation+jwt"
  string kid             = 2; // signing key id, also in the JWS protected header
}

message GetTunnelAttestationJWKSRequest {}
message GetTunnelAttestationJWKSResponse {
  bytes jwks = 1; // {"keys":[<AKP JWK>...]} — public keys only, served verbatim
}

message GetSecurityEventJWKSRequest {}
message GetSecurityEventJWKSResponse {
  bytes jwks = 1; // {"keys":[<AKP JWK>...]} — public keys only, served verbatim
}

message ClaimSecurityEventsRequest {
  int32 limit = 1; // 1..100; 0 = server default
}
message ClaimedSecurityEvent {
  string jti       = 1; // SET jti == outbox row id; use as Envelope.correlation_id
  string tenant_id = 2; // Envelope.tenant
  bytes  set_jws   = 3; // compact JWS, typ secevent+jwt -> Envelope.signed_artifact{kind:"set+jwt"}
}
message ClaimSecurityEventsResponse {
  repeated ClaimedSecurityEvent events = 1;
}

message AckSecurityEventRequest {
  string jti       = 1;
  bool   delivered = 2; // true = the receiver acked (accepted, or already seen)
  string error     = 3; // when !delivered: why (transport error, or receiver rejected)
  // when !delivered: the receiver verified the SET and refused it (accepted=false,
  // or InvalidArgument). The engine stops a row after 5 of these (failed_permanent);
  // anything else is transient and retried forever.
  bool   permanent = 4;
}
message AckSecurityEventResponse {}

message BootstrapPlatformCodeSigningRootRequest {
