message RecordCodeSignDenialRequest {
  string tenant_id  = 1; // resolved tenant ("system" for platform/Flow 1)
  // actor is a CLIENT-CLAIMED principal hint and is NOT authoritative (A9).
  // The engine records it under audit details.claimed_actor; the authoritative
  // audit `actor` column is always the verified mTLS channel identity.
  string actor      = 2;
  string code       = 3; // stable denial code, e.g. "RULE_NOT_MATCHED"
  string request_id = 4;
  string endpoint   = 5; // "sign_blob" | "sign_cert" | "timestamp"
}
message RecordCodeSignDenialResponse {}

message CheckACMEAccountRequest {
  string tenant_id            = 1; // injected from gRPC metadata x-tenant-id
  string account_id           = 2; // ACME account UUID (audit only)
  bytes  serial               = 3; // the account's latest issued leaf; empty before its first issuance
  string device_id            = 4; // the account's device_id (EAB-bound); empty for non-device accounts
  bool   attestation_required = 5; // the account re-attests every order, so expiry alone does not end its lineage
}
message CheckACMEAccountResponse {
  bool revoked = 1; // true: the lineage is over; the account must not be served
}

// RecordPrincipalDisableRequest carries the fact extracted from a verified
// wendyauth.v1 security-event token by the fabric frontend. The token itself
// (the raw SET) is NEVER relayed to the engine — only this extracted fact — and
// is never persisted or logged (secret-free).
message RecordPrincipalDisableRequest {
  string tenant_id     = 1; // injected from gRPC metadata x-tenant-id
  string principal_uri = 2; // SPIFFE URI of the disabled principal (authority: from the verified SET sub_id)
  string event_type    = 3; // short form: "account-disabled" | "account-purged" (RISC; disable) | "session-revoked" (CAEP; audit only, WDY-3448)
  string source_jti    = 4; // the SET jti — idempotency key for the replay cache
  int64  set_exp_unix  = 5; // the SET exp (unix seconds) — bounds the replay-cache row TTL
}
message RecordPrincipalDisableResponse {}

// RecordTenantDeletedRequest carries the fact extracted from a verified
// system-realm-signed wendyauth.v1 tenant-deleted SET by the fabric frontend
// (WDY-3177). It is the realm-scoped sibling of RecordPrincipalDisableRequest:
// the subject is the tenant itself (SET sub_id spiffe://wendy.sh/tenant/<uuid>),
// so the target tenant arrives as tenant_id and there is no principal_uri or
// event_type. The token itself (the raw SET) is NEVER relayed to the engine —
// only this extracted fact — and is never persisted or logged (secret-free).
message RecordTenantDeletedRequest {
  string tenant_id    = 1; // injected from gRPC metadata x-tenant-id (the deleted tenant, from the verified SET sub_id)
  string source_jti   = 2; // the SET jti — idempotency key for the replay cache
  int64  set_exp_unix = 3; // the SET exp (unix seconds) — bounds the replay-cache row TTL
}
message RecordTenantDeletedResponse {}

// RecordTenantLifecycleRequest carries the fact extracted from a verified
// system-realm-signed tenant-disabled / tenant-enabled SET (WDY-3543). The raw
// SET is never relayed, persisted or logged.
message RecordTenantLifecycleRequest {
  string tenant_id       = 1; // injected from gRPC metadata x-tenant-id (from the verified SET sub_id)
  string event_type      = 2; // short form: "tenant-disabled" | "tenant-enabled"
  string source_jti      = 3; // the SET jti — idempotency key for the replay cache
  int64  set_exp_unix    = 4; // the SET exp (unix seconds) — bounds the replay-cache row TTL
  int64  event_time_unix = 5; // the event's event_timestamp — orders disable/enable (strictly increasing per tenant; the fabric refuses one later than iat + skew)
}
message RecordTenantLifecycleResponse {}

// RecordEnrollmentTokenRevokeRequest carries the fact extracted from a verified
// cloud-origin token-revoke security-event token by the fabric frontend. The
// token itself (the raw SET) is NEVER relayed to the engine — only this
// extracted fact — and is never persisted or logged (secret-free).
message RecordEnrollmentTokenRevokeRequest {
  string token_kind = 1; // "eab" | "bootstrap"
  string token_ref  = 2; // opaque token reference (EAB key id / enrollment-token id)
  string tenant_id  = 3; // injected from gRPC metadata x-tenant-id
  string device_id  = 4; // optional device identifier
  string source_jti = 5; // the SET jti — idempotency key
}
message RecordEnrollmentTokenRevokeResponse {}

// RecordGrantJWKSRequest carries a grant issuer's JWKS document as fetched by
// the fabric frontend (WDY-2929). The document is relayed VERBATIM: the engine
// parses and validates it itself, so the fabric cannot narrow, reorder or
// reinterpret the key set on the way through.
//
// There is deliberately no timestamp field. Staleness is measured from the
// engine's own receipt time, so a fabric with a wrong or hostile clock cannot
// extend the freshness horizon.
message RecordGrantJWKSRequest {
  string issuer    = 1; // grant issuer URL; MUST match a configured grant.issuers key, else refused
  bytes  jwks_json = 2; // the JWKS document exactly as fetched from the issuer
}
message RecordGrantJWKSResponse {}

// NotarizePostboxHeadRequest is cloud's ASSERTION about its postbox head (W8).
// pki-core cannot verify max_id/head_hash — it holds no log — so a checkpoint
// notarizes the assertion, bound to pki-core's clock. What the notarization DOES
// enforce is monotonicity, fork-freedom, and receipt acknowledgement.
message NotarizePostboxHeadRequest {
  string tenant_id = 1; // injected from gRPC metadata x-tenant-id
  // Postbox scope: the target device's SPIFFE URI, or "" for a tenant-wide
  // postbox (whose notarization covers every device in the tenant).
  string target    = 2;
  uint64 max_id    = 3; // highest postbox entry id cloud asserts
  bytes  head_hash = 4; // cloud's hash of the head entry: raw SHA-256, 32 bytes
  // SHA-256 of each entry's EXACT compact-JWS signed-request bytes for entries
  // added since the last notarization. This is the same preimage a submission
  // receipt is keyed on, and is NOT W15's request_descriptor_hash (which hashes
  // the base64url-DECODED inner JWS payload). Acknowledging an entry marks the
  // matching receipt covered; leaving a receipt unacknowledged past the grace
  // window makes the next notarization fail with reason "receipt_outstanding".
  repeated bytes acknowledged_entry_hashes = 5;
}
message NotarizePostboxHeadResponse {
  bytes checkpoint = 1; // the encoded {body, timestamp_token} artifact
  // True when the head was unchanged and only the checkpoint TTL was refreshed
  // (a legitimate re-notarization), false when the watermark advanced.
  bool  repeat     = 2;
}

// RecordChangeRequestReceiptRequest carries the fact extracted from an
// operator-signed change request verified at the §5.3 frontend (W8).
message RecordChangeRequestReceiptRequest {
  string tenant_id         = 1; // injected from gRPC metadata x-tenant-id
  bytes  request_hash      = 2; // SHA-256 of the exact compact-JWS signed request, 32 bytes
  repeated string targets  = 3; // device SPIFFE URIs from the descriptor's target.devices
  string principal         = 4; // operator SPIFFE URI — authority: the VERIFIED leaf, never the payload
  int64  signing_time_unix = 5; // trusted RFC 3161 genTime; 0 ⇒ engine uses arrival time
}
message RecordChangeRequestReceiptResponse {}

message GetPostboxFreshnessRequest {
  string tenant_id = 1; // injected from gRPC metadata x-tenant-id
  string target    = 2; // the calling device's SPIFFE URI (from its verified cert)
}
message GetPostboxFreshnessResponse {
  // Latest notarized checkpoint for the target, falling back to the
  // tenant-wide ("") head. Empty when nothing has been notarized yet — a
  // device treats that as "no authoritative view" and fail-safes.
  bytes checkpoint = 1;
  // The OUTSTANDING set: operator-posted receipts pki-core holds for this
  // target that cloud has not acknowledged. This drives the notarization gate,
  // but note it is NOT cloud-independent — cloud zeroes it out simply by
  // asserting acknowledged_entry_hashes (pki-core cannot verify that claim; it
  // holds no log). Use the HELD set below for a bound cloud cannot retract.
  uint32 outstanding_count          = 2;
  repeated bytes outstanding_hashes = 3;
  int64  oldest_arrival_unix        = 4; // 0 when none outstanding

  // The HELD set: every receipt pki-core holds for this target within the
  // retention window, acknowledged or not. THIS is the cloud-independent lower
  // bound on the log's true contents (W8 review finding I1): an operator posted
  // each of these directly to pki-core, so a cloud that both withholds an entry
  // AND falsely acknowledges it cannot remove the evidence — it can only shrink
  // the outstanding set. A device shown fewer entries than held_count has
  // detected censorship with no cooperation from cloud whatsoever.
  uint32 held_count          = 5;
  repeated bytes held_hashes = 6;
  // True when held_hashes was capped by the server-side row limit, so
  // held_count is exact but the hash list is partial — a device must treat this
  // as "at least this many", never as the complete set.
  bool held_truncated        = 7;
}

// --- Unified X.509 renewal (W3) ---

// RenewCertificateRequest drives the dedicated renewal operation. The presented
// cert is an identity + possession claim: for a non-grant renewal it MUST be
// possession-proven by the caller (the frontend sources it from the mTLS peer
// handshake, never from an untrusted body), and for the D14 post-expiry path it
// may be an EXPIRED cert supplied in-band ONLY together with a grant (whose
// operator signature + principal match + CSR-key binding supply the safety
// instead of old-key possession).
message RenewCertificateRequest {
  bytes  presented_cert = 1; // DER of the current (or, with a grant, expired) cert
  bytes  csr            = 2; // DER PKCS#10 for the new key (possession proof)
  bytes  grant          = 3; // optional: W9-shaped operator grant (D14 grant-accept)
  string actor          = 4;
  string correlation_id = 5;
  // Proof that the caller holds presented_cert's private key, which the engine
  // verifies itself (the frontend's mTLS handshake is not evidence the engine
  // can check). Required for every non-device (operator/service) renewal,
  // with or without a grant (WDY-3437). Device lineages do not use it.
  // JWS Compact signed with presented_cert's key (alg per the key: ML-DSA-44/
  // 65/87, ES256, ES384, EdDSA), payload JSON, no other members:
  //   {"op":"renew",
  //    "cert_sha256":"<base64url, no padding, SHA-256 of presented_cert>",
  //    "csr_sha256":"<base64url, no padding, SHA-256 of csr>",
  //    "jti":"<unique, at most 128 bytes>","iat":<unix seconds>}
  // iat must be within the last 5 minutes (60s future skew); jti is single-use
  // per tenant.
  bytes  possession_proof = 6;
}

// RenewOutcome distinguishes renewal's outcomes, which issuance does not have.
// NEEDS_GRANT is the D14 seam: a post-expiry attempt is NOT a flat reject but a
// distinct "route to operator-approval / present a grant" outcome.
enum RenewOutcome {
  RENEW_OUTCOME_UNSPECIFIED = 0;
  RENEWED     = 1;
  DENIED      = 2;
  NEEDS_GRANT = 3;
}

message RenewCertificateResponse {
  RenewOutcome outcome        = 1;
  bytes        certificate    = 2; // DER leaf; set iff outcome == RENEWED
  bytes        chain          = 3; // DER intermediates (not root)
  bytes        ocsp_staple    = 4; // pre-generated OCSP response for offline carry
  string       correlation_id = 5;
  string       detail         = 6; // human-readable reason for DENIED / NEEDS_GRANT
}

enum OverDurationOutcome {
  OVER_DURATION_OUTCOME_UNSPECIFIED = 0;
  // Requested validity was within the tenant ceiling, so no second signature
  // is required. The certificate is still collected over
  // PickupOverDurationCertificate rather than returned inline.
  OVER_DURATION_OUTCOME_MINTED = 1;
  // Over the tenant ceiling (but within the platform cap): held pending a
  // second signature. certificate/chain are empty.
  OVER_DURATION_OUTCOME_ADDITIONAL_VERIFICATION_REQUIRED = 2;
  // kind==device_duration within ceiling, or approved: an authorization was
  // recorded rather than a certificate minted.
  OVER_DURATION_OUTCOME_AUTHORIZATION_RECORDED = 3;
}

message RequestOverDurationIssuanceRequest {
  // Operator-signed JWS (compact) whose payload is the canonical request
  // descriptor. The tenant, kind, profile, duration and CSR all come from
  // this signed payload — never from unsigned message fields.
  bytes signed_request = 1;
  // DER RFC 3161 TimeStampResp over signed_request.
  bytes timestamp_token = 2;
}

message RequestOverDurationIssuanceResponse {
  OverDurationOutcome outcome = 1;
  bytes certificate = 2;                 // MINTED only
  repeated bytes chain = 3;              // MINTED only
  string pending_request_id = 4;         // ADDITIONAL_VERIFICATION_REQUIRED only
  bytes request_hash = 5;                // the value an approver must sign over
  string device_authorization_id = 6;    // AUTHORIZATION_RECORDED only
  // The handle for PickupOverDurationCertificate, and the engine-side half of
  // FabricManagementService.OverDurationRequestResponse.collection_id: present
  // whenever there IS something to collect, WHATEVER the outcome — MINTED
  // included, which is why one field answers "what do I collect?" without the
  // caller ever branching on outcome.
  //
  // certificate/chain above are vestigial now the mint happens at pickup, and
  // pending_request_id carries this same value for the four-eyes outcome; both
  // are kept rather than renumbered.
  //
  // A fabric handler MUST relay collection_id, never pending_request_id. Both
  // hold the handle for ADDITIONAL_VERIFICATION_REQUIRED, but only this one is
  // populated for MINTED — so relaying pending_request_id passes every
  // four-eyes test and silently returns empty for MINTED, reintroducing the
  // outcome-branch this field exists to remove.
  string collection_id = 7;
}

message ApproveOverDurationIssuanceRequest {
  string pending_request_id = 1;
  // Operator-signed JWS whose payload is the canonical approval descriptor,
  // binding this approval to the pending request's hash.
  bytes signed_approval = 2;
  bytes timestamp_token = 3;
  // Cloud-signed rights attestation (compact JWS, "cloud-rights+jws") stating
  // that the approver holds pki:approve-over-duration at approval time, per
  // cloud's own RBAC resolver. Its authority is its OWN signature, verified
  // against the grant issuer JWKS — not its position in this message, and not
  // the transport. Distinct audience from a grant, single-use jti, short
  // lifetime; subject and request_id are re-derived engine-side and compared.
  //
  // Second signature and rights attestation answer different questions and
  // neither substitutes for the other: the approver's JWS proves WHO approved,
  // this proves that WHO is currently permitted to.
  bytes signed_rights = 4;
}

message ApproveOverDurationIssuanceResponse {
  OverDurationOutcome outcome = 1;
  bytes certificate = 2;              // operator_cert kind
  repeated bytes chain = 3;           // operator_cert kind
  string device_authorization_id = 4; // device_duration kind
}

// PickupOverDurationCertificateRequest presents the collection handle, the
// collecting operator's leaf, and the operator's SIGNED INTENT to collect this
// specific request now. The handle alone grants nothing: the engine derives the
// collector's identity from the certificate it verified and requires it to
// equal the principal that made the request.
message PickupOverDurationCertificateRequest {
  string collection_id = 1;              // RequestOverDurationIssuanceResponse.collection_id
  bytes presented_cert = 2;              // DER of the collecting operator's leaf
  // Operator-signed JWS (compact) whose payload is the pickup descriptor:
  //   {"op":"over_duration_pickup","tenant":<uuid>,"collection_id":<handle>,
  //    "iat":<unix>,"exp":<unix>,"jti":<unique>}
  //
  // REQUIRED (WDY-2691). Without it the presented certificate proves only
  // POSSESSION of a key, never INTENT to collect: any earlier JWS from that
  // operator would satisfy a possession check, so a relaying caller holding one
  // could collect at a moment of its choosing and burn the one-shot
  // authorization. This descriptor binds the signature to THIS collection_id,
  // within a bounded window, once — the jti is claimed single-use.
  //
  // Not optional and not phased: the RPC has no callers to break, and an
  // "enforce only when present" guard would leave the gap open to anyone who
  // simply omits the field.
  //
  // op, tenant and collection_id are all cross-checked (tenant additionally
  // against the transport-authenticated tenant, which must be non-empty — an
  // empty tenant is refused, never treated as matching an empty claim).
  bytes signed_pickup = 3;
}

// A second pickup is an ERROR, never an idempotent replay (WDY-2728). Nothing
// stores the minted certificate, so a repeat could only issue a SECOND
// certificate under one approval. The approved->consumed transition rides the
// mint's own transaction, so one approval yields exactly one certificate and a
// repeat is AlreadyExists.
//
// There is no recovery path: a collector that loses this response must go
// through four-eyes again.
message PickupOverDurationCertificateResponse {
  bytes certificate = 1;                 // DER leaf
  repeated bytes chain = 2;              // DER intermediates (not root)
}

message PendingOverDurationRequest {
  string id = 1;
  string kind = 2;
  string requester_principal = 3;
  string profile = 4;
  int64 requested_duration_seconds = 5;
  int64 tenant_ceiling_seconds = 6;
  string device_uri = 7;
  bytes request_hash = 8;
  int64 created_at_unix = 9;
  int64 expires_at_unix = 10;
}

message ListPendingOverDurationRequestsRequest {}
message ListPendingOverDurationRequestsResponse {
  repeated PendingOverDurationRequest requests = 1;
}
message GetPendingOverDurationRequestRequest { string id = 1; }

message DenyOverDurationIssuanceRequest {
  string pending_request_id = 1;
  // Originating tier-3 management-request jti; single-use enforced.
  string source_jti         = 2;
  // Cloud-signed rights attestation that the signing operator holds
  // pki:approve-over-duration now (denying is the approver's call). Same shape
  // as ApproveOverDurationIssuanceRequest.signed_rights.
  bytes  signed_rights      = 3;
  // WDY-3411: the operator's management-request JWS (op "deny_over_duration"),
  // relayed verbatim from Envelope.signed_artifact. The engine verifies it and
  // derives the denier's principal and source_jti from it; that principal is
  // the subject signed_rights must attest. The unsigned fields above must match.
  bytes  signed_request     = 4;
}
message DenyOverDurationIssuanceResponse {}

message RevokeByPrincipalRequest {
  string tenant_id     = 1; // injected from gRPC metadata x-tenant-id
  string principal     = 2; // SPIFFE URI; must belong to tenant_id
  int32  reason        = 3; // RFC 5280 reason code, applied to every leaf
  // The operator's management-request JWS (op "revoke_principal"), relayed
  // verbatim from Envelope.signed_artifact. The engine verifies it and takes
  // principal/reason and the single-use jti from its payload; the unsigned
  // fields above must match.
  bytes  signed_request = 4;
  // Cloud-signed rights attestation that the signing operator holds
  // pki:cert-revoke now. Same shape as RevokeCertificateRequest.signed_rights.
  bytes  signed_rights  = 5;
}
message RevokeByPrincipalResponse {
  int32 revoked_count = 1; // 0 is success: nothing live to revoke
}
message GetPendingOverDurationRequestResponse { PendingOverDurationRequest request = 1; }

// --- Operator-authority status (WDY-2217) ---

message CheckOperatorAuthorityRequest {
  // DER of the operator leaf whose authority is being checked. The full
  // certificate (not just a fingerprint) so the ENGINE performs every
  // derivation — tenant SPIFFE SAN, SHA-256 fingerprint, principal URI —
  // making the fabric edge and the engine-side over-duration verifier share
  // one implementation with no duplicated parsing rules.
  bytes certificate = 1;
}

message CheckOperatorAuthorityResponse {
  // True when this leaf's authority has been withdrawn and the caller MUST
  // reject the request.
  bool withdrawn = 1;
  // Machine-readable cause when withdrawn: "revoked" (certificate_ledger
  // revoked_at is set) or "principal_disabled" (disabled_principals kill
  // switch). Empty when withdrawn is false.
  string reason = 2;
}

// Verdict semantics for ValidateOperatorCertificate: the response reports
// only DEFINITE answers. Internal failures (storage unavailable, engine
// unreachable) surface as gRPC status errors, and the caller MUST fail closed
// on them. A `valid: false` verdict is final for the presented leaf (except
// "principal_disabled", which clears if the SSF disable is lifted); a
// `valid: true` verdict is point-in-time — cache it briefly (minutes) and
// never past `not_after`.
message ValidateOperatorCertificateRequest {
  // DER of the operator leaf to validate. For a signed request this is
  // exactly x5c[0]/x5chain[0], passed through verbatim. The full certificate
  // (not a fingerprint) so pki-core performs every derivation itself — chain
  // verification against the tenant's Operator-Authority CA, SPIFFE SAN
  // extraction, SHA-256 fingerprint — and the caller never parses X.509.
  // Presented intermediates are deliberately NOT accepted: pki-core validates
  // against the CA material it owns, not against what the requester supplied.
  // Set exactly one of certificate and leaf_sha256.
  bytes certificate = 1;
  // The leaf by reference (WDY-3463): base64url, unpadded, of SHA-256 over the
  // leaf DER (the RFC 7515 x5t#S256 value; the `kid` of a SignedRequest JWS).
  // pki-core looks the leaf up in the authenticated tenant's
  // certificate_ledger rows and runs the same checks on the stored DER. No row
  // in that tenant, including a leaf of another tenant, is "not_issued".
  // A ledger row without a stored DER (an operator leaf minted before pki-core
  // stored leaf DER) is the gRPC error FAILED_PRECONDITION "leaf not stored;
  // present the certificate", not a verdict: ask again with certificate.
  string leaf_sha256 = 2;
}

message ValidateOperatorCertificateResponse {
  // True only when every check passes: the leaf parses, chains to the
  // authenticated tenant's Operator-Authority CA, is inside its validity
  // window, has a certificate_ledger row without revoked_at, and its SPIFFE
  // principal has no disabled_principals record.
  bool valid = 1;
  // Machine-readable cause when !valid — the FIRST failure in check order:
  //   "malformed"          — leaf does not parse as an X.509 certificate
  //   "untrusted"          — does not chain to the tenant's Operator-Authority
  //                          CA (also covers a leaf of a DIFFERENT tenant:
  //                          anchors are strictly per-tenant)
  //   "not_operator"       — chains, but the SPIFFE SAN is not an operator
  //                          principal of the tenant
  //   "not_yet_valid"      — NotBefore is in the future
  //   "expired"            — NotAfter has passed (no roll-forward: an expired
  //                          operator re-onboards via wendy-auth)
  //   "not_issued"         — no certificate_ledger row: pki-core never minted
  //                          this leaf (definite refusal, not a lookup miss)
  //   "revoked"            — certificate_ledger revoked_at is set
  //   "principal_disabled" — sticky SSF-driven disabled_principals kill switch
  // Empty when valid.
  string reason = 2;
  // Server-derived SPIFFE URI of the operator principal, set only when valid.
  // This is the identity the caller should authorize against — returned so it
  // never extracts SANs from the leaf itself.
  string principal = 3;
  // RFC3339 leaf NotAfter, set only when valid. Hard upper bound for any
  // caller-side caching of this verdict.
  string not_after = 4;
  // The ledger's leaf DER, set only when valid and the request named the leaf
  // by leaf_sha256: the caller needs its public key to verify the signature.
  bytes certificate = 5;
}
