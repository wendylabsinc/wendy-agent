// proto/pkicore/v1/fabric_relay.proto
syntax = "proto3";
package pkicore.v1;
option go_package = "github.com/wendylabsinc/service-protos/pkicore/v1;pkicorev1";
import "wendyauth/v1/envelope.proto";

// FabricRelayService is the pki-core-authored receiver for the cloud→fabric→
// engine relay-for-issuance path (AAA §11, W9 + W18). Hosted on the private-only
// fabric frontend alongside wendyauth.v1.SecurityEventService. Reuses the shared
// wendyauth.v1.Envelope; authority rides in Envelope.signed_artifact and is
// re-verified before any mint (D7).
service FabricRelayService {
  // W9: Envelope.payload = serialized IssueCertificateRequest; signed_artifact =
  // {kind:"cloud-grant+jws", value:<grant JWS>}.
  rpc RelayIssuance(wendyauth.v1.Envelope) returns (RelayIssuanceResponse);
  // W18: signed_artifact = {kind:"enrollment-request+jws", value:<operator JWS>}.
  // WDY-3541: the JWS payload may carry an optional "label" claim (string, at
  // most 128 characters), stored on the minted EAB key / enrollment token and
  // returned by the list RPCs. The signer becomes the credential's created_by.
  // A pki-core older than WDY-3541 ignores the unknown claim and mints the
  // credential without a label, so a client sends "label" only once prod
  // pki-core carries it.
  rpc RelayEnrollment(wendyauth.v1.Envelope) returns (RelayEnrollmentResponse);
  // Connect-time capability/version handshake.
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
  // W8 (§5.3/D8): Envelope.payload = serialized PostboxHeadAssertion. No
  // signed_artifact — a head assertion carries no delegated authority; the
  // checkpoint notarizes cloud's claim, it does not believe it. Tenant is taken
  // from the transport-authenticated Envelope, never from the payload (D7).
  rpc NotarizePostboxHead(wendyauth.v1.Envelope) returns (RelayNotarizeHeadResponse);
  // W8 (§5.3 step 3 / D9): Envelope.payload = DER RFC 3161 TimeStampReq. Lets
  // cloud timestamp each accepted postbox entry over the authenticated,
  // tenant-attributed fabric instead of the public device-facing /v1/time.
  rpc RelayTimestamp(wendyauth.v1.Envelope) returns (RelayTimestampResponse);
  // WDY-2638: collects the certificate for an APPROVED over-duration request.
  // It lives here rather than on FabricManagementService because it returns a
  // certificate — the same reason RelayIssuance does. Tier 3: the operator's
  // signature is the authority, cloud only relays. Envelope.payload =
  // OverDurationPickupPayload; signed_artifact =
  // {kind:"over-duration-pickup+jws", value:<operator JWS>}. Tenant comes from
  // the transport-authenticated Envelope, never the payload (D7).
  //
  // There is no mTLS from the operator to pki-core over the fabric, so the
  // collecting operator's certificate travels in-band in the payload and the
  // JWS is what proves possession of its key. The server verifies BOTH that the
  // JWS validates against the presented certificate AND that the certificate
  // chains to the tenant's Operator Authority CA: the first alone proves only
  // possession of some key, the second alone proves only that a valid
  // certificate exists. Neither check is sufficient on its own.
  //
  // WDY-2691: possession is still not INTENT, so the JWS payload is no longer
  // opaque — it is the pickup descriptor
  //   {"op":"over_duration_pickup","tenant":<uuid>,"collection_id":<handle>,
  //    "iat":<unix>,"exp":<unix>,"jti":<unique>}
  // and the engine binds the signature to THIS collection_id, within a bounded
  // freshness window, once (single-use jti). Without that binding, a relaying
  // caller holding ANY earlier JWS from the operator could collect at a moment
  // of its choosing. The edge relays the artifact byte-verbatim; the engine is
  // where the descriptor is verified, because that is where the replay claim
  // and the mint are.
  rpc RelayOverDurationPickup(wendyauth.v1.Envelope) returns (RelayOverDurationPickupResponse);
}

// PostboxHeadAssertion is the Envelope.payload for NotarizePostboxHead. It
// deliberately carries NO tenant field: the tenant comes from the
// transport-authenticated Envelope, so a payload cannot name a tenant it was
// not authenticated for.
message PostboxHeadAssertion {
  string target    = 1; // device SPIFFE URI, or "" for a tenant-wide postbox
  uint64 max_id    = 2;
  bytes  head_hash = 3; // raw SHA-256, 32 bytes
  repeated bytes acknowledged_entry_hashes = 4;
}

// RelayNotarizeHeadResponse mirrors the engine's NotarizePostboxHeadResponse
// without importing engine.proto — the same decoupling RelayIssuanceResponse
// keeps from IssueCertificateResponse.
message RelayNotarizeHeadResponse {
  bytes checkpoint = 1; // the encoded {body, timestamp_token} artifact
  bool  repeat     = 2; // head unchanged, TTL refreshed
}

message RelayTimestampResponse {
  bytes tsr_response = 1; // DER RFC 3161 TimeStampResp
}

message RelayIssuanceResponse {
  bytes certificate = 1; // DER leaf
  bytes chain       = 2; // DER intermediates
  bytes ocsp_staple = 3;
}

message RelayEnrollmentResponse {
  string credential_kind = 1; // "eab" | "enrollment_token"
  string eab_key_id      = 2; // class A/B
  string eab_hmac_key    = 3; // hex, once only
  string token_id        = 4; // class C
  string token_value     = 5; // once only
  string expires_at      = 6; // RFC3339 (token)
}

// OverDurationPickupPayload is the Envelope.payload for
// RelayOverDurationPickup. Like PostboxHeadAssertion it deliberately carries no
// tenant field — the tenant comes from the transport-authenticated Envelope.
message OverDurationPickupPayload {
  string collection_id        = 1; // the OverDurationRequestResponse.collection_id handle
  bytes  operator_certificate = 2; // DER; the collecting operator's leaf, presented in-band
}

// RelayOverDurationPickupResponse mirrors the engine's over-duration mint
// result — the same decoupling RelayIssuanceResponse keeps from
// IssueCertificateResponse. No ocsp_staple: the over-duration mint produces none.
message RelayOverDurationPickupResponse {
  bytes          certificate = 1; // DER leaf
  repeated bytes chain       = 2; // DER intermediates (not root)
}

message GetCapabilitiesRequest {}
message GetCapabilitiesResponse {
  string proto_version              = 1;
  repeated string supported_methods = 2;
  map<string,string> features       = 3;
}
