syntax = "proto3";

package wendycloud.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/wendylabsinc/wendy/go/proto/gen/cloudpb";

service EventService {
  rpc PublishEvent(PublishEventRequest) returns (PublishEventResponse);
}

enum EventSeverity {
  EVENT_SEVERITY_UNSPECIFIED = 0;
  EVENT_SEVERITY_INFO = 1;
  EVENT_SEVERITY_WARNING = 2;
  EVENT_SEVERITY_ERROR = 3;
  EVENT_SEVERITY_CRITICAL = 4;
}

message EventTarget {
  oneof destination {
    LiveEventTarget live = 1;
  }
}

message LiveEventTarget {
  string camera_id = 1;
}

message Event {
  int64 id = 1;
  int32 organization_id = 2;
  int32 asset_id = 3;
  string app_id = 4;
  string source_event_id = 5;
  string title = 6;
  string body = 7;
  EventSeverity severity = 8;
  EventTarget target = 9;
  google.protobuf.Timestamp created_at = 10;
}

message PublishEventRequest {
  string source_event_id = 1;
  string app_id = 2;
  string title = 3;
  string body = 4;
  EventSeverity severity = 5;
  EventTarget target = 6;
}

message PublishEventResponse {
  Event event = 1;
  bool duplicate = 2;
  int32 recipient_count = 3;
}
