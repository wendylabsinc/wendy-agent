syntax = "proto3";

// First and only non-payload client message on a tunnel stream. Identifies
// the target device. For now the broker trusts this value; later it is
// cross-checked against enrollment data.
message WendyComTunnelOpen {
    uint32 asset_id = 1;
}

// One bare protobuf-encoded WendyComMessage body — no 8-byte link header.
// The broker adds/strips the header and owns the channel byte.
message WendyComTunnelPayload {
    bytes bytes = 1;
}

message WendyComTunnelMessage {
    oneof msg {
        WendyComTunnelOpen    open    = 1;
        WendyComTunnelPayload payload = 2;
    }
}
