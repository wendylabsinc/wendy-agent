syntax = "proto3";
package wendy.agent.services.v2;
option go_package = "github.com/wendylabsinc/wendy/go/proto/gen/agentpb/v2;agentpbv2";

// Sends simple commands over an existing paired Go2 connection. Never logs in,
// changes motion mode or opens another robot connection; the robot key stays in
// the agent. Registered only on the authenticated agent transport and the
// private admin socket, with the pairing-owner scope check.
service WendyUnitreeTeleopService {
  // A MOVE holds for 500 ms; the agent sends StopMove unless another MOVE
  // refreshes it. Any other command cancels a pending move.
  rpc Command(UnitreeCommandRequest) returns (UnitreeCommandResponse);
}

enum UnitreeCommand {
  UNITREE_COMMAND_UNSPECIFIED = 0;
  UNITREE_COMMAND_MOVE = 1;
  UNITREE_COMMAND_STOP = 2;
  UNITREE_COMMAND_STAND_UP = 3;
  UNITREE_COMMAND_LIE_DOWN = 4;
  UNITREE_COMMAND_HELLO = 5;
}

message UnitreeCommandRequest {
  string serial = 1;
  UnitreeCommand command = 2;
  // MOVE only. Finite values: |forward| <= 0.3 m/s, |yaw| <= 0.6 rad/s.
  double forward = 3;
  double yaw = 4;
}

message UnitreeCommandResponse {}
