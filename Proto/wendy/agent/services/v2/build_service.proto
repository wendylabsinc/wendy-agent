syntax = "proto3";

package wendy.agent.services.v2;

option go_package = "github.com/wendylabsinc/wendy/go/proto/gen/agentpb/v2;agentpbv2";

// WendyBuildService lets a CLI delegate a container image build to this device,
// so a developer's laptop does not have to be the machine that builds.
//
// BuildImage is remote code execution by design — that is the feature — so two
// things are non-negotiable here: the device must be explicitly opted in as a
// builder (see builder_enabled), and every field of a BuildSpec is re-validated
// on the server rather than trusted from the client, even an in-org one.
service WendyBuildService {
  rpc GetBuildCapabilities(GetBuildCapabilitiesRequest) returns (GetBuildCapabilitiesResponse);
  rpc BuildImage(stream BuildImageRequest) returns (stream BuildImageProgress);

  // SetBuildHostEnabled turns the builder role on or off, so opting a device in
  // does not require shell access to touch a file on it.
  //
  // This RPC requires a *user* certificate and refuses asset (device) ones. The
  // distinction is the whole point: a human with an org login can already
  // deploy arbitrary containers to this device with `wendy run`, so letting
  // them flip the builder role grants nothing they did not have. A device
  // certificate cannot, which is the threat that matters — one compromised
  // device in the org quietly conscripting its peers into build farms. Without
  // that split the gate would be decorative, since anyone able to call
  // BuildImage could simply call this first.
  rpc SetBuildHostEnabled(SetBuildHostEnabledRequest) returns (SetBuildHostEnabledResponse);
}

message SetBuildHostEnabledRequest {
  bool enabled = 1;
}

message SetBuildHostEnabledResponse {
  // Echoes the state now in effect, so a caller can confirm without a second
  // round trip.
  bool enabled = 1;
}

message GetBuildCapabilitiesRequest {}

message GetBuildCapabilitiesResponse {
  // False when buildkitd is absent — notably on a Mac agent, where containers
  // run under Apple Container, which has no BuildKit underneath.
  bool buildkit_available = 1;
  string buildkit_version = 2;
  string os = 3;
  string cpu_architecture = 4;
  // Platforms this host builds without emulation, e.g. "linux/arm64".
  repeated string native_platforms = 5;
  // Platforms reachable only through binfmt/QEMU. Building these works but is
  // slow enough that the CLI says so rather than letting it look like a hang.
  repeated string emulated_platforms = 6;
  // False unless this device is configured as a build host. Default off: being
  // reachable must not be the same as volunteering to run other people's builds.
  bool builder_enabled = 7;
}

// ChunkManifest reconstructs a byte stream from chunks already written through
// WendyContainerService.WriteChunks, which is a generic sha256-addressed store.
// Order is significant.
message ChunkManifest {
  repeated bytes chunk_hashes = 1;  // raw 32-byte sha256 digests, in order
  int64 total_size = 2;             // expected reassembled size, for validation
}

// DockerfileBuild builds through BuildKit's dockerfile.v0 frontend.
message DockerfileBuild {
  // Filename within the context, e.g. "Dockerfile" or "Dockerfile.generated".
  // Must not escape the context root.
  string dockerfile = 1;
  map<string, string> build_args = 2;
}

// PushTarget names where a finished image goes, as a mesh peer rather than a
// hostname.
//
// It is an asset id and not a name on purpose. Resolving
// "device-<id>.cloud.wendy.dev" requires the mesh DNS server, which only exists
// on WendyOS hosts — an adopted Linux box (where systemd-resolved owns
// 127.0.0.53) cannot resolve it, so a perfectly reachable peer looked
// unreachable. The agent's peer dialer needs only the id, and it is also a
// tighter capability: an id can only ever address a device in this org, whereas
// a free-form host could address anything. See WDY-2356.
message PushTarget {
  int32 asset_id = 1;
  uint32 registry_port = 2;
  // "repository:tag" only — never a host component.
  string repository = 3;
}

message BuildSpec {
  // App identifier. Also selects the stable per-app context directory, whose
  // path BuildKit uses as its local-source cache key — see the agent's
  // contextDir for why that path must not vary between builds.
  string app_id = 1;
  // Target platform, e.g. "linux/arm64".
  string platform = 2;
  // The build context as an uncompressed tar, addressed by chunk.
  ChunkManifest context = 4;
  // Where the finished image is pushed.
  PushTarget push_target = 7;

  // Field 3 was push_reference, a "host:port/repo:tag" string resolved through
  // DNS. Replaced by push_target — see that message for why.
  reserved 3;

  oneof definition {
    DockerfileBuild dockerfile_build = 5;
    // Field 6 is reserved for LlbBuild — the Stagefile path, which compiles to
    // LLB on the CLI and solves here. It depends on the Stagefile LLB backend
    // (PR #1606). Reserving it now means that path needs no protocol change.
  }
  reserved 6;
}

message BuildImageRequest {
  // The first message on the stream carries the spec. Later messages are
  // reserved for future incremental input and are rejected today.
  BuildSpec spec = 1;
}

message BuildImageProgress {
  oneof event {
    // One line of BuildKit plain-mode progress output, forwarded verbatim so
    // the CLI's existing renderer consumes it unchanged.
    string log_line = 1;
    BuildImageResult result = 2;
  }
}

message BuildImageResult {
  // Digest of the pushed image, e.g. "sha256:...". This may be empty when the
  // build host's BuildKit version does not report a structured result digest.
  string image_digest = 1;
}
