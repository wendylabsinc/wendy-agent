syntax = "proto3";
package wendy.agent.services.v2;
option go_package = "github.com/wendylabsinc/wendy/proto/gen/agentpb/v2;agentpbv2";

// Runtime driver add-ons delivered as systemd-sysext images. The agent verifies a
// signed .raw, stores it on /data, and applies it via the OS sysext-apply path
// (merge -> overlay -> depmod -> modprobe). Drivers are built ahead of time in CI
// against a pinned kernel; the device never compiles them.
service WendyDriverService {
    // Install (or update) a driver add-on: stream the .raw (--file) or hand the
    // agent a URL to fetch (registry by name), verify signature + sha256, place it
    // on /data, and apply. Streams Progress, then Completed or Failed.
    rpc InstallDriver(stream InstallDriverRequest) returns (stream DriverApplyResponse);

    // Remove a driver add-on and re-apply the remaining set. Streams progress.
    rpc RemoveDriver(RemoveDriverRequest) returns (stream DriverApplyResponse);

    // Report installed (declared) drivers plus realized state (merged extensions,
    // loaded modules) for the running OS/kernel.
    rpc ListDrivers(ListDriversRequest) returns (ListDriversResponse);
}

message InstallDriverRequest {
    oneof request_type {
        DriverSpec spec = 1;   // sent first, before any chunks
        Chunk chunk = 2;       // .raw bytes; omitted when spec.artifact_url is set
    }

    message Chunk {
        bytes data = 1;
    }
}

// Descriptor for one driver add-on. `name` is the systemd-sysext EXTENSION_NAME:
// the .raw is stored as /data/extensions/enabled/<name>.raw and must match the
// extension-release embedded in the image, or systemd-sysext refuses to merge it.
message DriverSpec {
    string name = 1;
    string version = 2;
    // Kernel the .ko was built against; must equal the device's `uname -r`.
    string kernel_version = 3;
    // SHA256 of the .raw (lowercase hex).
    string sha256 = 4;
    // Detached ML-DSA65 signature over the SHA256 digest (empty until a signer is
    // deployed; the agent rejects an unverifiable image once signing is enforced).
    bytes signature = 5;
    // Optional. When set, the agent fetches the .raw from this URL (cloud registry)
    // instead of receiving Chunks.
    string artifact_url = 6;
    // Kernel module names to load after merge (written to modules-load.d/<name>.conf).
    repeated string modules_load = 7;
    // Store the add-on for kernel_version without applying it, so a rebuild can be
    // put in place before the OTA that reboots into the kernel it targets. The
    // image must declare that same kernel; nothing is merged or modprobed.
    bool stage_only = 8;
}

// Streamed result of an install/remove apply.
message DriverApplyResponse {
    oneof response_type {
        Progress progress = 1;
        Completed completed = 2;
        Failed failed = 3;
    }

    message Progress {
        string phase = 1;
        int32 percent = 2;
    }

    message Completed {
        string name = 1;
        // A reboot is needed to finish (e.g. an in-use module could not be unloaded).
        bool reboot_required = 2;
    }

    message Failed {
        string error_message = 1;
    }
}

message RemoveDriverRequest {
    string name = 1;
    // Reserved: remove always deletes the .raw from the /data store. Kept so the
    // field number is not reused; the agent ignores it. Wire a keep-for-rollback
    // store before giving this meaning.
    bool purge = 2 [deprecated = true];
}

message ListDriversRequest {}

message ListDriversResponse {
    // Device os-release VERSION_ID and the running kernel (uname -r).
    string base_version = 1;
    string kernel_version = 2;

    repeated InstalledDriver installed = 3;

    // Realized state, read live from the device.
    repeated string merged_extensions = 4;  // `systemd-sysext list`
    repeated string loaded_modules = 5;      // /proc/modules
}

message InstalledDriver {
    string name = 1;
    string version = 2;
    string kernel_version = 3;
    string sha256 = 4;
    repeated string modules_load = 5;
    // True when every module in modules_load is currently loaded.
    bool loaded = 6;
    // True when the stored image could not be read, so kernel_version is unknown
    // rather than absent. systemd-sysext will not merge it either.
    bool unreadable = 7;
}
