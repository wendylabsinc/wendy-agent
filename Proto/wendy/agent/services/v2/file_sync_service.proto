syntax = "proto3";
package wendy.agent.services.v2;
option go_package = "github.com/wendylabsinc/wendy/proto/gen/agentpb/v2;agentpbv2";

service WendyFileSyncService {
    rpc SyncFiles(stream FileSyncRequest) returns (stream FileSyncResponse);
}

message FileSyncEntry {
    string path   = 1;
    int64  size   = 2;
    bytes  sha256 = 3;
    uint32 mode   = 4;
}

message FileSyncRequest {
    oneof request_type {
        FileSyncStart  start  = 1;
        FileSyncChunk  chunk  = 2;
        FileSyncCommit commit = 3;
        FileSyncChmod  chmod  = 4;
        FileSyncDelete delete = 5;
    }
}

message FileSyncStart {
    string           app_id   = 1;
    FileSyncManifest manifest = 2;

    // Sync into a persistent volume (/var/lib/wendy/volumes/<volume>) instead
    // of an app sync root. Mutually exclusive with app_id: exactly one of the
    // two selects the sync root. The Linux agent implements volume mode only;
    // app_id mode is the macOS agent's native-app sync.
    string volume = 3;

    // Restrict the session to this subtree of the sync root. The manifest the
    // agent replies with covers only paths under the prefix, and every path in
    // the session (chunk, commit, chmod, delete) is interpreted relative to it.
    //
    // Without this, pushing one file into a volume makes the agent hash every
    // file already in that volume to build its manifest — for a volume holding
    // several 50 MB models that is seconds of wasted I/O per push — and the
    // client sees unrelated files as candidates for deletion.
    string path_prefix = 4;
}

message FileSyncChunk {
    string path            = 1;
    bytes  data            = 2;
    uint64 sequence        = 3;
    int64  cumulative_size = 4;
    bytes  sha256          = 5;
}

message FileSyncCommit {
    string path   = 1;
    bytes  sha256 = 2;
    int64  size   = 3;
}

message FileSyncChmod {
    string path   = 1;
    uint32 mode   = 2;
    int64  size   = 3;
    bytes  sha256 = 4;
}

message FileSyncDelete {
    repeated string paths = 1;
}

message FileSyncResponse {
    oneof response_type {
        FileSyncManifest manifest = 1;
        FileSyncAck      ack      = 2;
        FileSyncComplete complete = 3;
    }
}

message FileSyncManifest {
    repeated FileSyncEntry files = 1;
}

message FileSyncAck {
    string path = 1;
}

message FileSyncComplete {}
