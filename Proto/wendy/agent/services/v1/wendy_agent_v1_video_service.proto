syntax = "proto3";

package wendy.agent.services.v1;

service WendyVideoService {
    rpc ListVideoDevices(ListVideoDevicesRequest) returns (ListVideoDevicesResponse);
    rpc StreamVideo(StreamVideoRequest) returns (stream VideoFrame);
    rpc SetCameraCredentials(SetCameraCredentialsRequest) returns (SetCameraCredentialsResponse);
    rpc ForgetCamera(ForgetCameraRequest) returns (ForgetCameraResponse);
    rpc RefreshCameras(RefreshCamerasRequest) returns (RefreshCamerasResponse);
}

message VideoDevice {
    uint32 id              = 1; // numeric suffix of /dev/videoN; network cameras use the reserved 200-255 band
    string name            = 2; // human-readable name from sysfs, or the model for network cameras
    string path            = 3; // e.g. "/dev/video0"; empty for a network camera with no loopback node
    VideoTransport transport = 4; // interface (csi, usb, ip, unknown)
    string driver          = 5; // kernel driver name from sysfs (e.g. "uvcvideo", "tegra-capture-vi"); empty if unknown
    string libcamera_id    = 6; // libcamera camera-name; empty when libcamera enumeration unavailable or ambiguous
    string address          = 7; // network camera address, e.g. "10.98.0.50"; empty for local cameras
    string model            = 8; // model reported by discovery, e.g. "RLC-520A"
    string mac              = 9; // stable identity for network cameras; empty for local cameras
    bool has_credentials    = 10; // the agent holds a login for this camera
    bool online             = 11; // the most recent probe reached this camera
}

enum VideoTransport {
    VIDEO_TRANSPORT_UNKNOWN = 0;
    VIDEO_TRANSPORT_USB     = 1;
    VIDEO_TRANSPORT_CSI     = 2;
    VIDEO_TRANSPORT_IP      = 3;
}

message ListVideoDevicesRequest {}

message ListVideoDevicesResponse {
    repeated VideoDevice devices = 1;
    // What this device can serve beyond a primary stream. Absent from older
    // agents, which serve the primary stream only.
    VideoStreamCapabilities stream_capabilities = 2;
}

message StreamVideoRequest {
    uint32 device_id  = 1; // numeric suffix N in /dev/videoN; 0 maps to /dev/video0
    // For local cameras width/height/framerate configure capture. For network
    // cameras the camera decides its own format, so width only selects which of
    // its streams to open (sub or main) and height/framerate are ignored.
    uint32 width      = 2; // pixels; 0 = device default
    uint32 height     = 3; // pixels; 0 = device default
    uint32 framerate  = 4; // fps; 0 = device default

    // Upper bound on how many frames per second THIS subscriber receives; 0 =
    // every frame (the historical behaviour). Unlike width/height/framerate this
    // is a property of one connection, not of the camera: subscribers sharing a
    // camera may each set a different value, and none of them is rejected for
    // disagreeing. Nothing about capture or encoding changes — the same frames
    // are produced either way — so this saves uplink bytes, not device CPU.
    //
    // Delivery is anchored to keyframes, because an H.264 frame is only
    // decodable with the frames it depends on. A limited subscriber therefore
    // receives whole keyframe-to-keyframe groups, and its effective rate is
    // rounded to that granularity: with the default keyframe interval of half a
    // second, asking for 1 fps yields one group per second, not one frame. Set
    // keyframe_interval_frames to make the granularity finer.
    //
    // Only applies to H.264. A VP8 stream is delivered whole regardless, because
    // its frames are wrapped in a WebM container that cannot be cut mid-stream.
    uint32 max_framerate = 5;

    // Frames between keyframes for the shared encoder; 0 = half a second's worth
    // (framerate/2). Unlike max_framerate this reconfigures the encoder everyone
    // shares, so it takes part in the stream-parameter compatibility check.
    //
    // It exists because it sets the floor on how finely max_framerate can be
    // honoured, and how quickly a new subscriber gets a decodable picture. Short
    // intervals cost bitrate (keyframes are large); 1 makes every frame
    // independent and every rate exactly achievable, at the highest byte cost.
    uint32 keyframe_interval_frames = 6;

    // Ask for a stream at different dimensions or bitrate from the camera's
    // primary one. Unset means the primary stream, which is what every existing
    // client gets and what this field must never change for them.
    //
    // Like max_framerate this is a property of one connection and takes no part
    // in the stream-parameter compatibility check, so subscribers may ask for
    // different variants without any of them being rejected.
    //
    // Variants are shared BY VALUE: subscribers asking for the same dimensions
    // and bitrate are served by one stream between them, so the device's cost
    // scales with the number of distinct variants, not with the number of
    // clients. The obvious implementation — one variant per subscriber — is the
    // expensive one and is deliberately not what this is.
    //
    // A device serves a variant only when it can do so without taking capacity
    // from what else it runs, and reports what it can do in
    // VideoStreamCapabilities. Ask for one it cannot serve and the request is
    // refused with a reason; it is never silently downgraded, and never served
    // by starving another workload on the device.
    StreamVariant variant = 7;
}

// A requested stream shape. Zero fields mean "same as the primary stream", so
// an empty variant is a request for the primary.
message StreamVariant {
    uint32 width       = 1; // pixels; 0 = same as primary
    uint32 height      = 2; // pixels; 0 = same as primary
    uint32 bitrate_bps = 3; // target bitrate; 0 = encoder default
}

// What a device can offer beyond its primary stream. Reported so a client can
// ask for what exists rather than discovering the limits by being refused.
message VideoStreamCapabilities {
    // The device has usable video-encode hardware. When false, producing a
    // second stream costs general CPU that may be committed to other work.
    bool hardware_encode = 1;

    // How many distinct variants the device will serve at once, beyond the
    // primary. Zero means variants are unavailable and only the primary stream
    // (optionally rate-limited per subscriber) can be served.
    uint32 max_variants = 2;

    // Why max_variants is what it is, in words, for a human reading a log or an
    // error. Not meant to be parsed.
    string variant_note = 3;

    // Per-subscriber frame rate limiting (max_framerate) is available. It costs
    // the device nothing, so it is offered wherever this agent runs.
    bool per_subscriber_framerate = 4;
}

// Credentials for a network camera. Stored on the device, never returned by any
// RPC: listings report only has_credentials.
message SetCameraCredentialsRequest {
    uint32 device_id = 1;
    string username  = 2;
    string password  = 3;
}

message SetCameraCredentialsResponse {}

message ForgetCameraRequest {
    uint32 device_id = 1;
}

message ForgetCameraResponse {}

message RefreshCamerasRequest {}

message RefreshCamerasResponse {
    repeated VideoDevice devices = 1;
}

enum VideoCodec {
    VIDEO_CODEC_H264 = 0; // raw H.264 annexb NAL units (default)
    VIDEO_CODEC_VP8  = 1; // VP8 inside a WebM container (webmmux streamable=true)
}

message VideoFrame {
    bytes      data         = 1; // chunk of encoded video; concatenate chunks in order; format described by codec
    uint64     timestamp_ns = 2; // wall-clock timestamp in nanoseconds
    VideoCodec codec        = 3; // codec used; default 0 = H264
}
