name: Nightly OS Update

on:
  schedule:
    - cron: '0 2 * * *'  # 02:00 UTC daily
  workflow_dispatch: {}
  # Retry deferred nightly work after a stable release frees the runner.
  workflow_run:
    workflows: [Build products and release]
    types: [completed]

permissions:
  contents: read
  actions: read

# A retry and the scheduled run must not enqueue two device matrices.
concurrency:
  # Unrelated build completions skip immediately, outside the device queue.
  group: >-
    nightly-os-update-${{ (github.event_name != 'workflow_run' ||
    (github.event.workflow_run.event == 'workflow_dispatch' &&
    (startsWith(github.event.workflow_run.display_title, 'Stable release · ') ||
    github.event.workflow_run.display_title == 'Build products and release'))) && 'devices' || github.run_id }}
  cancel-in-progress: false
  queue: max

# All wendy CLI invocations in this workflow run via "ssh localhost" rather than
# directly. The self-hosted runner runs as a macOS LaunchAgent which does not
# hold the Local Network TCC permission that macOS requires for mDNS (.local)
# resolution and link-local connections. SSHing to localhost spawns a shell
# under the logged-in user session, which does have that permission.
# See integration-tests.yml for the same pattern with more context.

jobs:
  release-priority:
    name: Check for stable releases
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'workflow_dispatch' &&
       (startsWith(github.event.workflow_run.display_title, 'Stable release · ') ||
        github.event.workflow_run.display_title == 'Build products and release'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.priority.outputs.allowed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check whether this release deferred nightly work
        id: retry
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { hasDeferredNightly } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-priority.cjs`);
            const deferred = await hasDeferredNightly({ github, context, releaseId: context.payload.workflow_run.id });
            core.setOutput('deferred', String(deferred));
      - uses: ./.github/actions/release-priority
        id: priority
        if: github.event_name != 'workflow_run' || steps.retry.outputs.deferred == 'true'

  discover:
    name: Discover devices
    needs: release-priority
    if: needs.release-priority.outputs.allowed == 'true'
    runs-on:
      group: wendy-developer
      labels: [self-hosted, macOS, ARM64, wendy-macos-26]
    outputs:
      matrix: ${{ steps.scan.outputs.matrix || '[]' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # A release can arrive after the hosted check but before runner assignment.
      - uses: ./.github/actions/release-priority
        id: priority

      - name: Set up Go
        if: steps.priority.outputs.allowed == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build CLI
        if: steps.priority.outputs.allowed == 'true'
        working-directory: go
        run: make build-cli

      - name: Clear cache and scan for WendyOS devices
        id: scan
        if: steps.priority.outputs.allowed == 'true'
        run: |
          SSH="ssh -o StrictHostKeyChecking=no localhost"
          WORKDIR="$(pwd)"
          SSH_ENV="export PATH='$PATH'"

          $SSH "$SSH_ENV && cd '$WORKDIR' && ./go/bin/wendy os cache clear"

          RESULT=$($SSH "$SSH_ENV && cd '$WORKDIR' && ./go/bin/wendy discover --json --type lan --timeout 10s")
          echo "$RESULT" | jq '[.lanDevices[] | select(.isWendyDevice) | {name: .displayName, address: (.hostname // .ipAddress)}]'

          MATRIX=$(echo "$RESULT" | jq -c \
            '[.lanDevices[] | select(.isWendyDevice and (.hostname // .ipAddress)) | .hostname // .ipAddress]')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

          COUNT=$(echo "$MATRIX" | jq 'length')
          echo "Found $COUNT device(s)."
          [ "$COUNT" -gt 0 ] || { echo "No WendyOS devices found — nothing to update."; }

  update:
    name: ${{ matrix.hostname }}
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    runs-on:
      group: wendy-developer
      labels: [self-hosted, macOS, ARM64, wendy-macos-26]
    concurrency:
      group: device-${{ matrix.hostname }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      # Keep background work from filling the runner and per-device queues.
      max-parallel: 1
      matrix:
        hostname: ${{ fromJson(needs.discover.outputs.matrix) }}
    timeout-minutes: 60
    env:
      DEVICE_HOSTNAME: ${{ matrix.hostname }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/release-priority
        id: priority

      - name: Set up Go
        if: steps.priority.outputs.allowed == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build CLI
        if: steps.priority.outputs.allowed == 'true'
        working-directory: go
        run: make build-cli

      - name: Current version
        id: version
        if: steps.priority.outputs.allowed == 'true'
        run: |
          SSH="ssh -o StrictHostKeyChecking=no localhost"
          WORKDIR="$(pwd)"
          SSH_ENV="export PATH='$PATH'"

          INFO=$($SSH "$SSH_ENV && cd '$WORKDIR' && ./go/bin/wendy device info --json --device '$DEVICE_HOSTNAME'" || true)
          echo "$INFO" | jq '{osVersion, agentVersion: .version, deviceType}' || true
          DEVICE_TYPE=$(echo "$INFO" | jq -r '.deviceType // ""' 2>/dev/null || true)
          echo "device_type=$DEVICE_TYPE" >> "$GITHUB_OUTPUT"
          if [[ -z "$DEVICE_TYPE" ]]; then
            echo "No device type reported — skipping OS update."
          fi

      - name: Flash OS update, confirm online, and run template tests
        if: steps.priority.outputs.allowed == 'true' && steps.version.outputs.device_type != ''
        run: |
          SSH="ssh -o StrictHostKeyChecking=no localhost"
          WORKDIR="$(pwd)"
          SSH_ENV="export PATH='$PATH'"

          # wendy os update blocks until the device reboots and comes back
          # online, with a 5-minute internal timeout.
          $SSH "$SSH_ENV && cd '$WORKDIR' && ./go/bin/wendy os update --device '$DEVICE_HOSTNAME'"

          $SSH "$SSH_ENV && cd '$WORKDIR' && ./go/bin/wendy device info --json --device '$DEVICE_HOSTNAME'" \
            | jq '{osVersion, agentVersion: .version}'

          $SSH "$SSH_ENV && cd '$WORKDIR' && go/scripts/test-templates.sh -w ./go/bin/wendy -h '$DEVICE_HOSTNAME'"
