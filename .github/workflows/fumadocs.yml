name: Fumadocs

on:
  push:
    branches: ["**"]
    paths:
      - "docs/**"
      - ".github/workflows/fumadocs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/fumadocs.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fumadocs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    outputs:
      deploy_path: ${{ steps.path.outputs.deploy_path }}
      deploy_paths: ${{ steps.path.outputs.deploy_paths }}
      url: ${{ steps.path.outputs.url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compute docs path
        id: path
        shell: bash
        run: |
          set -euo pipefail

          sanitize() {
            printf '%s' "$1" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//'
          }

          DEPLOY_PATHS=()

          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            RAW_VERSION="$(jq -r '.release.tag_name // env.GITHUB_REF_NAME' "$GITHUB_EVENT_PATH")"
            VERSION="$(sanitize "${RAW_VERSION}")"
            IS_PRERELEASE="$(jq -r '.release.prerelease // false' "$GITHUB_EVENT_PATH")"

            if [[ -z "${VERSION}" || ! "${VERSION}" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]; then
              echo "::error::Unsupported release tag for docs deploy path: ${RAW_VERSION}"
              exit 1
            fi

            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              DEPLOY_PATH="release-nightly-${VERSION}"
              DEPLOY_PATHS=("${DEPLOY_PATH}" "latest-nightly")
            else
              DEPLOY_PATH="release-${VERSION}"
              DEPLOY_PATHS=("${DEPLOY_PATH}" "latest")
            fi
          else
            BRANCH="$(sanitize "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}")"
            DEPLOY_PATH="branch-${BRANCH}-${GITHUB_SHA}"
            DEPLOY_PATHS=("${DEPLOY_PATH}")
          fi

          echo "deploy_path=${DEPLOY_PATH}" >> "$GITHUB_OUTPUT"
          {
            echo "deploy_paths<<EOF"
            printf '%s\n' "${DEPLOY_PATHS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "url=https://docs.wendy.dev/${DEPLOY_PATH}/" >> "$GITHUB_OUTPUT"

      - name: Build static site exports
        env:
          DEPLOY_PATHS: ${{ steps.path.outputs.deploy_paths }}
          NEXT_PUBLIC_GITHUB_REF_NAME: ${{ github.head_ref || github.ref_name }}
          NEXT_PUBLIC_SITE_URL: https://docs.wendy.dev
        run: |
          set -euo pipefail

          rm -rf export
          mkdir -p export

          while IFS= read -r DEPLOY_PATH; do
            [[ -n "${DEPLOY_PATH}" ]] || continue

            echo "::group::Build ${DEPLOY_PATH}"
            rm -rf out
            NEXT_PUBLIC_BASE_PATH="/${DEPLOY_PATH}" npm run build
            mkdir -p "export/${DEPLOY_PATH}"
            cp -R out/. "export/${DEPLOY_PATH}/"
            echo "::endgroup::"
          done <<< "${DEPLOY_PATHS}"

      - name: Upload static site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fumadocs-static-site
          path: docs/export
          if-no-files-found: error

  deploy:
    name: Deploy docs
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
    environment:
      name: docs
      url: ${{ needs.build.outputs.url }}
    steps:
      - name: Download static site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fumadocs-static-site
          path: out

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Upload to Cloud Storage
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          DOCS_BUCKET: wendy-docs-public
          DEPLOY_PATHS: ${{ needs.build.outputs.deploy_paths }}
        run: |
          set -euo pipefail

          while IFS= read -r DEPLOY_PATH; do
            [[ -n "${DEPLOY_PATH}" ]] || continue

            gcloud storage rsync "out/${DEPLOY_PATH}" "gs://${DOCS_BUCKET}/${DEPLOY_PATH}" \
              --recursive \
              --delete-unmatched-destination-objects \
              --quiet \
              --project="${GCP_PROJECT_ID}"
            gcloud storage objects update "gs://${DOCS_BUCKET}/${DEPLOY_PATH}/**" \
              --cache-control="public, max-age=300" \
              --quiet \
              --project="${GCP_PROJECT_ID}"
          done <<< "${DEPLOY_PATHS}"
