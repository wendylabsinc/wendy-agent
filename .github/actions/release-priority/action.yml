name: Give stable releases priority
description: Defer nightly device work while a stable release is active.
outputs:
  allowed:
    description: Whether nightly work may start.
    value: ${{ steps.check.outputs.allowed }}
runs:
  using: composite
  steps:
    - name: Check active stable releases
      id: check
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      with:
        script: |
          const { activeStableReleases } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-priority.cjs`);
          const releases = await activeStableReleases({ github, context });
          core.setOutput('allowed', String(releases.length === 0));
          if (releases.length) {
            // One blocking release is enough. If another is still active when
            // the retry starts, that retry records its own deferral.
            const releaseId = releases[0].id;
            const name = `nightly-deferred-for-${releaseId}`;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: context.runId, per_page: 100,
            });
            if (!artifacts.some(artifact => artifact.name === name && !artifact.expired)) {
              const fs = require('node:fs');
              const path = require('node:path');
              const marker = path.join(process.env.RUNNER_TEMP, 'nightly-release-deferral.txt');
              fs.writeFileSync(marker, `Nightly work deferred for ${releases[0].html_url}\n`);
              core.setOutput('marker', marker);
              core.setOutput('artifact', name);
            }
            const links = releases.map(run => run.html_url).join('\n');
            core.notice(`Nightly work deferred for stable releases:\n${links}`);
            await core.summary
              .addHeading('Nightly work deferred')
              .addRaw('A stable release needs the shared runner. An update already underway is allowed to finish. Nightly work will retry after the release completes.\n\n')
              .addRaw(links)
              .write();
          }
    - name: Record deferred nightly work
      if: steps.check.outputs.marker != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ${{ steps.check.outputs.artifact }}
        path: ${{ steps.check.outputs.marker }}
        retention-days: 7
        if-no-files-found: error
