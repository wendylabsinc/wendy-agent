syntax = "proto3";

// Everything in the wendy.agent.apps package is APP-FACING: it is reachable by
// an entitled application over a per-app private unix socket that the agent
// creates for that app alone, and it is the only surface an application can
// reach. Nothing here is part of the device control plane.
//
// The control-plane counterpart is wendy.agent.services.v2, served over device
// mutual Transport Layer Security alongside provisioning, WiFi, container and
// update services. Applications cannot reach that package at all. The two live
// in separate proto packages precisely so the trust boundary is visible in the
// protocol rather than left to a comment or a runtime policy check: if a
// definition is in this package it is exposed to apps, and if it is not in this
// package it is not.
package wendy.agent.apps.v1;

option go_package = "github.com/wendylabsinc/wendy/go/proto/gen/appspb/v1;appspbv1";

// SensorService is the read-only model-input surface of the harness. An app
// with the "sensor-read" entitlement receives a private socket serving THIS
// service and nothing else, so the grant cannot reach episode control,
// campaign deployment, or downloads.
//
// It is a sibling of DataService rather than two more methods on it: the
// entitlement's whole point is that the app reaches sensor subscription only.
// A gRPC server exposes services, not methods, so keeping Subscribe on
// DataService would put Start, Stop, Download, and CampaignDeploy on the same
// socket and leave a per-method interceptor allowlist as the only barrier. A
// separate service, in a separate package, makes the boundary structural
// instead of a policy check.
//
// Samples are identified by (source_id, sample_id). sample_id is assigned by
// the producer that feeds every consumer of that source, so the sample a model
// received and the sample an episode recorded carry the same identifier and
// can be joined offline. Canonical times are signed CLOCK_BOOTTIME nanoseconds.
service SensorService {
  // Sources lists the sensor sources this app may subscribe to, using the same
  // identifiers `wendy data sources` reports.
  rpc Sources(SensorSourcesRequest) returns (SensorSourcesResponse);
  // Subscribe joins the existing producer for each requested source and streams
  // its samples. The subscriber is one more consumer of the same producer the
  // episode capture adapter uses, so subscribing never takes a device away from
  // capture (or from another app).
  rpc Subscribe(SensorSubscribeRequest) returns (stream SensorSample);
  // SubscribeFrameIdentity streams the identity of each frame the agent wrote to
  // a source's v4l2loopback node, carrying NO pixels.
  //
  // This is the control plane of the two-plane camera path. An app that wants to
  // use ordinary tooling reads the pixels from the loopback node with ffmpeg or
  // GStreamer (the data plane) and joins them to harness identity through this
  // stream, instead of receiving frames over gRPC. Because the node is fed from
  // the same producer hub that episode capture consumes, the frame the app
  // scores is provably the frame the episode recorded, which is not true of an
  // app that opens the camera device itself.
  //
  // The primary join key is loopback_sequence, which an app reads from the
  // v4l2_buffer.sequence of the buffer it dequeued. See FrameIdentity for why
  // that number is assigned by the kernel rather than chosen by the agent, and
  // for what a consumer must do about dropped frames.
  //
  // The buffer's timestamp is a SECONDARY key carrying the same identity
  // in-band. The agent stamps each buffer with boottime_nanos truncated to
  // whole microseconds, so an app can match a dequeued buffer by
  // boottime_nanos / 1000 as well, and can cross-check the sequence join it
  // already made. See FrameIdentity for the exact derivation.
  //
  // This grants strictly less than Subscribe, which already carries every
  // identity field below alongside the payload. It does NOT grant the loopback
  // node itself: reading the node is a device-node grant and remains the
  // separate camera entitlement. An app needs both to use the two-plane path.
  rpc SubscribeFrameIdentity(FrameIdentitySubscribeRequest) returns (stream FrameIdentity);
}

message SensorSource {
  string id = 1;
  string kind = 2;
  string clock_domain = 3;
  bool healthy = 4;
  string detail = 5;
  // subscribable reports whether this source can be streamed through
  // SensorService.Subscribe. Sources whose producer cannot yet multiplex are
  // listed with subscribable=false and a detail saying why, rather than
  // omitted: a caller must be able to tell "not available to models" from
  // "does not exist".
  bool subscribable = 6;
  // loopback_node_path is the v4l2loopback device node carrying this source's
  // frames on the two-plane data path, for example "/dev/video200". Empty when
  // the source has no such node, which is the normal case: a node exists only
  // for a source whose frames can be identified frame-for-frame, and only while
  // an app entitled to BOTH sensor-read and camera is running.
  //
  // An empty value is not an error and an app must handle it: it means the
  // two-plane path is unavailable for this source and the app should fall back
  // to Subscribe, which always works.
  string loopback_node_path = 7;
}
message SensorSourcesRequest {}
message SensorSourcesResponse { repeated SensorSource sources = 1; }

message SensorSubscribeRequest {
  // source_ids are the sources to stream, as reported by Sources (and by
  // `wendy data sources`). At least one is required.
  repeated string source_ids = 1;
  // model optionally names the model consuming this stream. It is recorded in
  // the episode's model-input ledger so an episode says which model consumed
  // which samples.
  string model = 2;
}

message SensorSample {
  string source_id = 1;
  // sample_id increases monotonically per source and is the join key between
  // what a model consumed, what an episode recorded, and what a prediction
  // references. It does not restart when a subscriber joins or leaves.
  uint64 sample_id = 2;
  // boottime_nanos is the agent's bracketed receipt of this sample on the
  // canonical CLOCK_BOOTTIME timeline, with the bracket half-width in
  // timestamp_uncertainty_nanos. An episode's own index may carry a
  // higher-fidelity canonical time for the same sample (a device clock mapped
  // into CLOCK_BOOTTIME); join on sample_id, not on time.
  int64 boottime_nanos = 3;
  int64 timestamp_uncertainty_nanos = 4;
  bytes payload = 5;
  // encoding names the payload bytes, for example "h264" or "vp8".
  string encoding = 6;
  // payload_self_contained reports that payload holds exactly one whole
  // encoded access unit. When false the payload is an arbitrary chunk of the
  // source's byte stream and must be reassembled before decoding.
  bool payload_self_contained = 7;
  // dropped_before counts samples this subscriber lost since the previous
  // delivered sample because it was not reading fast enough. It is the honest
  // explanation for gaps in sample_id.
  uint64 dropped_before = 8;
  // boot_id is the kernel boot the timestamps belong to.
  string boot_id = 9;
  // sample_rate_hz, channels and duration_nanos describe a payload that carries
  // a BUFFER of equally spaced samples rather than a single instant. When
  // sample_rate_hz is non-zero, boottime_nanos names the FIRST sample in the
  // payload, and the k-th sample (zero-based, counting frames of `channels`
  // interleaved values) lies at
  // boottime_nanos + k * 1000000000 / sample_rate_hz. duration_nanos is the
  // span the whole payload covers, derived from its length. A consumer must
  // count samples into the buffer rather than assume a fixed chunk size,
  // because a producer may deliver buffers of varying length. All three are
  // zero for a single-instant sample, such as a camera frame, which is the
  // compatible default.
  uint32 sample_rate_hz = 10;
  uint32 channels = 11;
  int64 duration_nanos = 12;
}

message FrameIdentitySubscribeRequest {
  // source_ids are the sources whose frame identities to stream, as reported by
  // Sources. At least one is required.
  repeated string source_ids = 1;
  // model optionally names the model consuming the frames, recorded in the
  // episode's model-input ledger exactly as SensorSubscribeRequest.model is.
  string model = 2;
}

// FrameIdentity names one frame the agent wrote to a source's v4l2loopback node.
// It carries no pixels: the pixels are on the node.
//
// # Why loopback_sequence is the kernel's number and not ours
//
// The natural design would be for the agent to stamp sample_id directly into
// v4l2_buffer.sequence, so a consumer reads the harness identifier straight off
// the buffer. The v4l2loopback module makes that impossible: its QBUF handler
// overwrites the sequence of any queued output buffer with its own internal
// write counter, discarding whatever the writer supplied. There is no option or
// flag that disables it.
//
// So the agent does the opposite. It reads back the sequence the kernel assigned
// (QBUF returns it), and publishes the resulting mapping on this stream. A
// consumer takes v4l2_buffer.sequence off the frame it dequeued and finds the
// FrameIdentity carrying the same value. The number is therefore authoritative
// and requires no assumption that frames arrive in a particular order, which is
// what makes the join trustworthy.
//
// # The buffer TIMESTAMP, unlike the sequence, is the agent's own
//
// That limit applies to the sequence field alone. Verified against v4l2loopback
// v0.15.4, the same QBUF handler copies a writer-supplied timestamp through
// verbatim and substitutes the module's own clock only when the writer supplies
// a zero one. It also latches V4L2_BUF_FLAG_TIMESTAMP_COPY on the buffer, which
// means precisely "this timestamp came from the writer"; DQBUF clears only the
// QUEUED and DONE flags, so both the value and that flag reach the reader.
//
// The agent therefore stamps every buffer with this message's boottime_nanos,
// truncated to whole microseconds by struct timeval. Identity rides IN BAND as
// well as on this stream, and a reader that checks the COPY flag can prove the
// value is the agent's rather than a clock reading. There is no separate field
// for it here because it is exactly boottime_nanos / 1000: see
// loopback_sequence below for the derivation and why it is exact.
//
// # Dropped frames: two different losses, two different signals
//
// A consumer that watches only one of these will believe frames were delivered
// that were not. Both must be checked.
//
//  1. The agent could not keep up feeding the node. Those samples never reached
//     the node at all, so loopback_sequence stays DENSE across the loss and
//     shows no gap. The loss appears only here, as a jump in sample_id, and is
//     counted exactly by dropped_before.
//
//  2. The application could not keep up reading the node. v4l2loopback
//     fast-forwards an overrun reader rather than blocking it, so the
//     application's next dequeued buffer has a sequence that JUMPED. This loss
//     is invisible on this stream, because the agent did write those frames. The
//     application detects it by comparing the sequence of consecutive dequeued
//     buffers: the difference minus one is the number it missed.
//
// In short: a sample_id jump means the agent fell behind, a sequence jump means
// the reader fell behind, and both can happen at once.
//
// A frame the agent failed to write appears in neither: it consumes no sequence
// and produces no FrameIdentity, so it is absent rather than reported as lost.
message FrameIdentity {
  string source_id = 1;
  // sample_id is the same identifier SensorSample.sample_id carries and the same
  // one the episode capture index and the model-input ledger record, so a frame
  // scored off the loopback node can be joined to what the episode kept.
  uint64 sample_id = 2;
  // boottime_nanos and timestamp_uncertainty_nanos are the agent's bracketed
  // CLOCK_BOOTTIME receipt of this sample and the bracket half-width, identical
  // to the values SensorSample reports for the same sample.
  int64 boottime_nanos = 3;
  int64 timestamp_uncertainty_nanos = 4;
  // loopback_sequence is the v4l2_buffer.sequence the KERNEL assigned to this
  // frame on the node. It is the PRIMARY join key: match it against the
  // sequence of the buffer dequeued from the node. See the message comment for
  // why the agent cannot choose this value.
  //
  // The dequeued buffer's timestamp is a secondary key and a cross-check on
  // that join, because the agent stamps it rather than the module. Its expected
  // value is derived, not carried: a v4l2_buffer timestamp is a struct timeval,
  // so the frame whose identity this is has
  //
  //     timestamp.tv_sec * 1000000 + timestamp.tv_usec == boottime_nanos / 1000
  //
  // The truncation to whole microseconds is exact rather than approximate,
  // because 1000000000 divides evenly by 1000, so the equality is not a
  // tolerance. Nothing in this message repeats that value: a second copy of a
  // derivable number could only ever agree or rot.
  //
  // Two microsecond stamps cannot collide at any realistic frame rate: at 30
  // frames per second consecutive frames are about 33333 microseconds apart.
  // The sequence stays primary all the same, because it alone makes an
  // application-side drop visible, as case 2 above describes.
  uint32 loopback_sequence = 5;
  // dropped_before counts samples lost between the producer and the node since
  // the previous frame written. It is the ONLY report of loss case 1 above,
  // because that loss leaves no gap in loopback_sequence.
  uint64 dropped_before = 6;
  // boot_id is the kernel boot the timestamps belong to.
  string boot_id = 7;
  // node_path is the v4l2loopback node this frame was written to, so an app
  // subscribing to several sources knows which node each identity belongs to.
  string node_path = 8;
}
