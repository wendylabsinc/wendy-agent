version: 1
stages:
  # Build in the full Swift toolchain image, run in the slim one. This is the
  # shape `wendy run`'s Swift path produces implicitly (cross-compile on the
  # host, append the binary to swift:<version>-slim); writing it out makes the
  # toolchain version, the product, and the runtime layout reviewable, and
  # digest-pins both images through build.stagefile.lock.yaml.
  - name: build
    from: swift:6.3.2-noble
    workdir: /build
    copy:
      - from: local
        paths: [Package.swift]
      - from: local
        paths: [Sources]
    build:
      lang: swift
      # --product is load-bearing, not tidiness: this package depends on
      # swift-container-plugin, and a bare `swift build` compiles that
      # dependency's own plugin executables too, which fails with
      # "package-name is empty".
      product: HelloWorld
  - name: app
    from: swift:6.3.2-noble-slim
    # No workdir: the binary sits at /HelloWorld, matching the layout
    # swift-container-plugin produces (`/<product>` as the entrypoint), so
    # anything that resolves paths from the working directory behaves the same.
    copy:
      - from: build
        paths: [/build/.build/release/HelloWorld]
        dest: /HelloWorld
    cmd: [/HelloWorld]
