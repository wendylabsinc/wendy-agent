version: 1
stages:
  - name: app
    # CUDA 13 is required for DGX Spark's GB10 Blackwell GPU (sm_121). The
    # official image is multi-arch and publishes a native linux/arm64 build.
    # Do not add `cuda: true`: this image already carries its CUDA userspace;
    # Wendy's gpu entitlement supplies the host driver and device nodes.
    from: ghcr.io/ggml-org/llama.cpp:server-cuda13
    env:
      # The 8B Q4_K_M model and F16 audio projector total about 6.3 GB. Exact
      # revisions keep a future upstream update from silently changing a demo.
      MODEL_URL_1: https://huggingface.co/ggml-org/ultravox-v0_5-llama-3_1-8b-GGUF/resolve/7a0280d66c0700c366c2c26586e0f0967f97bad0/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf
      MMPROJ_URL: https://huggingface.co/ggml-org/ultravox-v0_5-llama-3_1-8b-GGUF/resolve/7a0280d66c0700c366c2c26586e0f0967f97bad0/mmproj-ultravox-v0_5-llama-3_1-8b-f16.gguf
      MODEL_ALIAS: ultravox-v0.5-llama-3.1-8b-q4-k-m
      CONTEXT_SIZE: "16384"
      MEMORY_BUDGET_GIB: "12"
      MIN_SYSTEM_MEMORY_GIB: "16"
      MIN_AVAILABLE_MEMORY_GIB: "12"
      MIN_CUDA_MEMORY_GIB: "12"
      GPU_LAYERS: all
      FLASH_ATTENTION: "on"
      VOICE_PORT: "8080"
      VOICE_WEB_ROOT: /app
      LLAMA_PORT: "8081"
      TTS_MODEL_URL: https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-multi-lang-v1_0.tar.bz2
      TTS_MODEL_SHA256: c133d26353d776da730870dac7da07dbfc9a5e3bc80cc5e8e83ab6e823be7046
      TTS_MODEL_DIR: /models/kokoro-multi-lang-v1_0
      TTS_SPEAKER_ID: "3"
      TTS_SPEED: "1.04"
      TTS_THREADS: "8"
      # Capture directly from the Spark through ALSA. Override the device name
      # at deploy time when the microphone is not the system default.
      AUDIO_SOURCE: default
      ALSA_CAPTURE_DEVICE: default
      # Replies are synthesized by Kokoro and sent straight to this ALSA PCM.
      # No browser or desktop audio session participates in playback.
      ALSA_PLAYBACK_DEVICE: default
      AUTO_LISTEN: "true"
    install:
      apt:
        packages: [alsa-utils, aria2, bzip2, ca-certificates, python3, python3-pip]
      pip:
        - packages: ["sherpa-onnx==1.13.4"]
    copy:
      - from: local
        paths: [entrypoint.sh, voice_server.py]
        dest: /usr/local/bin/dgx-spark-speechllm
        mode: "0755"
      - from: local
        paths: [web]
        dest: /app
    entrypoint:
      exec: [/usr/local/bin/dgx-spark-speechllm/entrypoint.sh]
    # The persistent model volume is root-owned, and the NVIDIA CDI device
    # mounts used by the gpu entitlement are accessible to root.
    user: root
