---
- name: Run GitHub runner preflight
  ansible.builtin.include_tasks:
    file: preflight.yml
    apply:
      tags: preflight
  tags: [preflight]

- name: Include macOS GitHub runner tasks
  ansible.builtin.include_tasks:
    file: macos.yml
    apply:
      tags: [runner, github_runner]
  when: ansible_facts.system == 'Darwin'
  tags: [runner, github_runner]

- name: Include Ubuntu GitHub runner tasks
  ansible.builtin.include_tasks:
    file: ubuntu.yml
    apply:
      tags: [runner, github_runner]
  when: ansible_facts.distribution == 'Ubuntu'
  tags: [runner, github_runner]

- name: Include Windows GitHub runner tasks
  ansible.builtin.include_tasks:
    file: windows.yml
    apply:
      tags: [runner, github_runner]
  when: ansible_facts.os_family == 'Windows'
  tags: [runner, github_runner]
