---
- name: Ensure GitHub runner directory exists
  ansible.builtin.file:
    path: "{{ github_runner_dir }}"
    state: directory
    mode: '0755'
  when: install_github_runner

- name: Check GitHub runner registration
  ansible.builtin.stat:
    path: "{{ github_runner_dir }}/.runner"
  register: github_runner_macos_registered
  when: install_github_runner

- name: Check GitHub runner files
  ansible.builtin.stat:
    path: "{{ github_runner_dir }}/config.sh"
  register: github_runner_macos_config
  when: install_github_runner

- name: Prompt for GitHub runner registration token
  ansible.builtin.pause:
    prompt: "Enter GitHub runner registration token for {{ inventory_hostname }} ({{ github_runner_url }})"
    echo: false
  register: github_runner_macos_token_prompt
  no_log: true
  when:
    - install_github_runner
    - github_runner_prompt_for_token
    - not github_runner_macos_registered.stat.exists
    - github_runner_token is none

- name: Set effective GitHub runner registration token
  ansible.builtin.set_fact:
    github_runner_effective_token: "{{ github_runner_token | default(github_runner_macos_token_prompt.user_input | default(''), true) }}"
  no_log: true
  when: install_github_runner

- name: Require GitHub runner registration token
  ansible.builtin.fail:
    msg: "GitHub runner registration token is required for unregistered runner {{ inventory_hostname }}."
  when:
    - install_github_runner
    - github_runner_prompt_for_token
    - not github_runner_macos_registered.stat.exists
    - github_runner_effective_token | default('') | length == 0

- name: Resolve latest GitHub Actions runner release
  ansible.builtin.uri:
    url: https://api.github.com/repos/actions/runner/releases/latest
    return_content: true
  register: github_runner_macos_latest
  when: install_github_runner and not github_runner_macos_config.stat.exists

- name: Set macOS GitHub runner artifact facts
  ansible.builtin.set_fact:
    github_runner_version: "{{ github_runner_macos_latest.json.tag_name | regex_replace('^v', '') }}"
    github_runner_arch: "{{ 'arm64' if ansible_facts.architecture == 'arm64' else 'x64' }}"
  when: install_github_runner and not github_runner_macos_config.stat.exists

- name: Download GitHub Actions runner archive
  ansible.builtin.get_url:
    url: "https://github.com/actions/runner/releases/download/v{{ github_runner_version }}/actions-runner-osx-{{ github_runner_arch }}-{{ github_runner_version }}.tar.gz"
    dest: "{{ github_runner_dir }}/actions-runner.tar.gz"
    mode: '0644'
    force: true
  when: install_github_runner and not github_runner_macos_config.stat.exists

- name: Extract GitHub Actions runner archive
  ansible.builtin.command: >-
    /usr/bin/tar -xzf {{ github_runner_dir }}/actions-runner.tar.gz -C {{ github_runner_dir }}
  args:
    creates: "{{ github_runner_dir }}/config.sh"
  when: install_github_runner and not github_runner_macos_config.stat.exists

- name: Register GitHub Actions runner when token is provided
  ansible.builtin.command: >-
    ./config.sh --unattended --url {{ github_runner_url }} --token {{ github_runner_effective_token }}
    --name {{ github_runner_name }} --work {{ github_runner_work_dir }}
    {{ ('--runnergroup ' + github_runner_group) if github_runner_group is not none else '' }}
    {{ ('--labels ' + (github_runner_effective_labels | join(','))) if github_runner_effective_labels | length > 0 else '' }}
  args:
    chdir: "{{ github_runner_dir }}"
    creates: "{{ github_runner_dir }}/.runner"
  no_log: true
  when: install_github_runner and not github_runner_macos_registered.stat.exists and github_runner_effective_token | default('') | length > 0

- name: Print manual GitHub runner registration instructions
  ansible.builtin.debug:
    msg:
      - "Runner is installed but not registered. Generate a registration token outside git."
      - "Then run: cd {{ github_runner_dir }} && ./config.sh --url {{ github_runner_url }} --token <token> --name {{ github_runner_name }} --work {{ github_runner_work_dir }} {{ ('--runnergroup ' + github_runner_group) if github_runner_group is not none else '' }} {{ ('--labels ' + (github_runner_effective_labels | join(','))) if github_runner_effective_labels | length > 0 else '' }}"
  when:
    - install_github_runner
    - not github_runner_macos_registered.stat.exists
    - not github_runner_prompt_for_token
    - github_runner_token is none

- name: Refresh macOS runner registration state
  ansible.builtin.stat:
    path: "{{ github_runner_dir }}/.runner"
  register: github_runner_macos_registered_after
  when: install_github_runner

- name: Ensure LaunchAgents directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/Library/LaunchAgents"
    state: directory
    mode: '0755'
  when: install_github_runner and github_runner_mode == 'login' and github_runner_macos_registered_after.stat.exists

- name: Find existing GitHub runner LaunchAgents
  ansible.builtin.find:
    paths: "{{ ansible_env.HOME }}/Library/LaunchAgents"
    patterns: "com.github.actions.runner*.plist"
    file_type: file
  register: github_runner_macos_existing_launchagents
  when: install_github_runner and github_runner_mode == 'login' and github_runner_macos_registered_after.stat.exists

- name: Keep existing macOS runner LaunchAgent
  ansible.builtin.debug:
    msg: "Existing GitHub runner LaunchAgent found; leaving startup unchanged: {{ github_runner_macos_existing_launchagents.files | map(attribute='path') | list }}"
  when:
    - install_github_runner
    - github_runner_mode == 'login'
    - github_runner_macos_registered_after.stat.exists
    - github_runner_macos_existing_launchagents.matched | default(0) > 0

- name: Install GitHub runner LaunchAgent
  ansible.builtin.template:
    src: macos_launchagent.plist.j2
    dest: "{{ ansible_env.HOME }}/Library/LaunchAgents/com.github.actions.runner.{{ github_runner_name }}.plist"
    mode: '0644'
  register: github_runner_macos_launchagent
  when:
    - install_github_runner
    - github_runner_mode == 'login'
    - github_runner_macos_registered_after.stat.exists
    - github_runner_macos_existing_launchagents.matched | default(0) == 0

- name: Bootstrap GitHub runner LaunchAgent
  ansible.builtin.command: >-
    launchctl bootstrap gui/{{ ansible_facts.user_uid }} {{ ansible_env.HOME }}/Library/LaunchAgents/com.github.actions.runner.{{ github_runner_name }}.plist
  register: github_runner_macos_bootstrap
  changed_when: github_runner_macos_bootstrap.rc == 0
  failed_when: github_runner_macos_bootstrap.rc not in [0, 5]
  when:
    - github_runner_macos_launchagent is defined
    - not github_runner_macos_launchagent.skipped | default(false)

- name: Start GitHub runner LaunchAgent
  ansible.builtin.command: "launchctl kickstart -k gui/{{ ansible_facts.user_uid }}/com.github.actions.runner.{{ github_runner_name }}"
  changed_when: true
  when:
    - github_runner_macos_launchagent is defined
    - not github_runner_macos_launchagent.skipped | default(false)
