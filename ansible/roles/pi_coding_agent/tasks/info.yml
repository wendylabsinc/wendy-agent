---
- name: Check POSIX Pi coding agent
  ansible.builtin.shell: |
    set -o pipefail
    set +e
    pi_path="$(command -v pi || true)"
    if [[ -n "$pi_path" ]]; then
      pi_version="$(pi --version 2>&1)"
      pi_rc=$?
      if [[ $pi_rc -eq 0 ]]; then
        echo "pi=$pi_version"
      else
        echo "pi=present version_check_failed rc=$pi_rc"
        echo "$pi_version"
      fi
    else
      echo "pi=missing"
    fi
    if [[ -f "$HOME/.pi/agent/auth.json" ]]; then
      echo "pi_auth=present"
    else
      echo "pi_auth=missing"
    fi
  args:
    executable: /bin/bash
  register: pi_coding_agent_posix_info
  environment:
    PATH: "{{ homebrew_prefix }}/bin:/usr/local/bin:{{ ansible_env.PATH }}"
  changed_when: false
  failed_when: false
  when: ansible_facts.os_family != 'Windows'

- name: Report POSIX Pi coding agent
  ansible.builtin.debug:
    var: pi_coding_agent_posix_info.stdout_lines
  changed_when: false
  when: ansible_facts.os_family != 'Windows'

- name: Check Windows Pi coding agent
  ansible.windows.win_shell: |
    $pi = (Get-Command pi.cmd -ErrorAction SilentlyContinue)
    if (-not $pi) { $pi = Get-Command pi -ErrorAction SilentlyContinue }
    if ($pi) {
      $piVersion = cmd.exe /c pi --version 2`>`&1
      if ($LASTEXITCODE -eq 0) {
        "pi=$piVersion"
      } else {
        "pi=present version_check_failed rc=$LASTEXITCODE"
        $piVersion
      }
    } else {
      "pi=missing"
    }

    $auth = Join-Path $env:USERPROFILE '.pi\agent\auth.json'
    if (Test-Path $auth) { 'pi_auth=present' } else { 'pi_auth=missing' }
  register: pi_coding_agent_windows_info
  changed_when: false
  failed_when: false
  when: ansible_facts.os_family == 'Windows'

- name: Report Windows Pi coding agent
  ansible.builtin.debug:
    var: pi_coding_agent_windows_info.stdout_lines
  changed_when: false
  when: ansible_facts.os_family == 'Windows'
