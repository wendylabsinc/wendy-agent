---
- name: Check POSIX Wendy tools
  ansible.builtin.shell: |
    set -o pipefail
    set +e
    echo "wendy=$({ command -v wendy >/dev/null && wendy --version; } || echo missing)"
    echo "wendy_daemon=$({ command -v wendy-agent >/dev/null && wendy-agent --version; } || echo missing)"
  args:
    executable: /bin/bash
  register: wendy_tools_posix_info
  environment:
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_env.PATH }}"
  changed_when: false
  failed_when: false
  when: ansible_facts.os_family != 'Windows'

- name: Report POSIX Wendy tools
  ansible.builtin.debug:
    var: wendy_tools_posix_info.stdout_lines
  changed_when: false
  when: ansible_facts.os_family != 'Windows'

- name: Check Windows Wendy tools
  ansible.windows.win_shell: |
    try { "wendy=$(wendy --version)" } catch { "wendy=missing" }
  register: wendy_tools_windows_info
  changed_when: false
  failed_when: false
  when: ansible_facts.os_family == 'Windows'

- name: Report Windows Wendy tools
  ansible.builtin.debug:
    var: wendy_tools_windows_info.stdout_lines
  changed_when: false
  when: ansible_facts.os_family == 'Windows'
