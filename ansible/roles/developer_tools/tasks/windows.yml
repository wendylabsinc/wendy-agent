---
- name: Ensure winget is available
  ansible.windows.win_command: winget --version
  changed_when: false

- name: Build configured Windows package list
  ansible.builtin.set_fact:
    developer_tools_windows_packages: "{{ windows_winget_packages + ([windows_claude_code_package] if install_claude_code else []) + ([windows_openai_codex_package] if install_openai_codex else []) }}"

- name: Install configured winget packages
  ansible.windows.win_shell: |
    $id = '{{ item.id }}'
    $name = '{{ item.name }}'
    $override = @'
    {{ item.override | default('') }}
    '@.Trim()
    winget list --id $id --exact --source winget --disable-interactivity | Out-Null
    if ($LASTEXITCODE -eq 0) {
      "already installed: $name"
      exit 0
    }
    $args = @('install', '--id', $id, '--exact', '--source', 'winget', '--accept-source-agreements', '--accept-package-agreements', '--disable-interactivity', '--silent')
    if ($override) { $args += @('--override', $override) }
    & winget @args
    exit $LASTEXITCODE
  loop: "{{ developer_tools_windows_packages }}"
  register: developer_tools_windows_winget
  changed_when: "'already installed:' not in developer_tools_windows_winget.stdout"

- name: Install GNU Make provider when requested
  ansible.windows.win_shell: |
    $id = '{{ windows_make_package.id }}'
    winget list --id $id --exact --source winget --disable-interactivity | Out-Null
    if ($LASTEXITCODE -eq 0) { 'already installed'; exit 0 }
    winget install --id $id --exact --source winget --accept-source-agreements --accept-package-agreements --disable-interactivity --silent
  register: developer_tools_windows_make
  changed_when: "'already installed' not in developer_tools_windows_make.stdout"
  when: install_gnu_make
