---
- name: Check POSIX developer tools
  ansible.builtin.shell: |
    set -o pipefail
    set +e
    echo "git=$({ command -v git >/dev/null && git --version; } || echo missing)"
    echo "go=$({ command -v go >/dev/null && go version; } || echo missing)"
    echo "node=$({ command -v node >/dev/null && node --version; } || echo missing)"
    echo "npm=$({ command -v npm >/dev/null && npm --version; } || echo missing)"
    echo "nvim=$({ command -v nvim >/dev/null && nvim --version | head -n 1; } || echo missing)"
    echo "curl=$({ command -v curl >/dev/null && curl --version | head -n 1; } || echo missing)"
    echo "direnv=$({ command -v direnv >/dev/null && direnv --version; } || echo missing)"
    echo "claude=$({ command -v claude >/dev/null && claude --version; } || echo missing)"
    echo "codex=$({ command -v codex >/dev/null && codex --version; } || echo missing)"
    echo "brew=$(command -v brew || true)"
  args:
    executable: /bin/bash
  register: developer_tools_posix_preflight
  changed_when: false
  failed_when: false
  when: ansible_facts.os_family != 'Windows'

- name: Report POSIX developer tools
  ansible.builtin.debug:
    var: developer_tools_posix_preflight.stdout_lines
  changed_when: false
  when: ansible_facts.os_family != 'Windows'

- name: Check Windows developer tools
  ansible.windows.win_shell: |
    try { "git=$(git --version)" } catch { "git=missing" }
    try { "go=$(go version)" } catch { "go=missing" }
    try { "node=$(node --version)" } catch { "node=missing" }
    try { "npm=$(npm --version)" } catch { "npm=missing" }
    try { "nvim=$((nvim --version | Select-Object -First 1))" } catch { "nvim=missing" }
    try { "winget=$(winget --version)" } catch { "winget=missing" }
    try { "claude=$(claude --version)" } catch { "claude=missing" }
    try { "codex=$(codex --version)" } catch { "codex=missing" }
  register: developer_tools_windows_preflight
  changed_when: false
  failed_when: false
  when: ansible_facts.os_family == 'Windows'

- name: Report Windows developer tools
  ansible.builtin.debug:
    var: developer_tools_windows_preflight.stdout_lines
  changed_when: false
  when: ansible_facts.os_family == 'Windows'
