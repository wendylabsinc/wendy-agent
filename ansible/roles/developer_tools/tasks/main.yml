---
- name: Run developer tools info
  ansible.builtin.include_tasks:
    file: info.yml
    apply:
      tags: info
  tags: [info]

- name: Include macOS developer tools tasks
  ansible.builtin.include_tasks:
    file: macos.yml
    apply:
      tags: [packages, developer_tools]
  when: ansible_facts.system == 'Darwin'
  tags: [packages, developer_tools]

- name: Include Ubuntu developer tools tasks
  ansible.builtin.include_tasks:
    file: ubuntu.yml
    apply:
      tags: [packages, developer_tools]
  when: ansible_facts.distribution == 'Ubuntu'
  tags: [packages, developer_tools]

- name: Include Windows developer tools tasks
  ansible.builtin.include_tasks:
    file: windows.yml
    apply:
      tags: [packages, developer_tools]
  when: ansible_facts.os_family == 'Windows'
  tags: [packages, developer_tools]
