---
- name: Run Swift info
  ansible.builtin.include_tasks:
    file: info.yml
    apply:
      tags: info
  tags: [info]

- name: Include macOS Swift tasks
  ansible.builtin.include_tasks:
    file: macos.yml
    apply:
      tags: [swift]
  when: ansible_facts.system == 'Darwin'
  tags: [swift]

- name: Include Ubuntu Swift tasks
  ansible.builtin.include_tasks:
    file: ubuntu.yml
    apply:
      tags: [swift]
  when: ansible_facts.distribution == 'Ubuntu'
  tags: [swift]

- name: Include Windows Swift tasks
  ansible.builtin.include_tasks:
    file: windows.yml
    apply:
      tags: [swift]
  when: ansible_facts.os_family == 'Windows'
  tags: [swift]
