---
- name: Report common platform facts
  ansible.builtin.debug:
    msg:
      host: "{{ inventory_hostname }}"
      ci_site: "{{ ci_site | default('unknown') }}"
      machine_profile: "{{ machine_profile | default('unknown') }}"
      system: "{{ ansible_facts.system | default('unknown') }}"
      os_family: "{{ ansible_facts.os_family | default('unknown') }}"
      distribution: "{{ ansible_facts.distribution | default('unknown') }}"
      distribution_version: "{{ ansible_facts.distribution_version | default('unknown') }}"
      architecture: "{{ ansible_facts.architecture | default('unknown') }}"
      user: "{{ ansible_user_id | default(ansible_user | default('unknown')) }}"
      home: "{{ ansible_env.HOME | default(ansible_env.USERPROFILE | default('unknown')) }}"
  changed_when: false

- name: Check POSIX sudo state
  ansible.builtin.command: sudo -n true
  register: common_sudo_info
  changed_when: false
  failed_when: false
  when: ansible_facts.os_family != 'Windows'

- name: Report POSIX sudo state
  ansible.builtin.debug:
    msg: "sudo={{ 'passwordless' if common_sudo_info.rc == 0 else 'needs-password-or-unavailable' }}"
  changed_when: false
  when: ansible_facts.os_family != 'Windows'

- name: Check Windows identity
  ansible.windows.win_whoami:
  register: common_windows_whoami
  when: ansible_facts.os_family == 'Windows'

- name: Report Windows admin state
  ansible.builtin.debug:
    msg:
      user: "{{ common_windows_whoami.account.domain_name }}\\{{ common_windows_whoami.account.account_name }}"
      label: "{{ common_windows_whoami.label.account_name }}"
      is_admin: "{{ 'S-1-5-32-544' in (common_windows_whoami.groups | map(attribute='sid') | list) }}"
  changed_when: false
  when: ansible_facts.os_family == 'Windows'

- name: Check Windows long path state
  ansible.windows.win_shell: |
    $registry = Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -ErrorAction SilentlyContinue
    "win32_long_paths=$($registry.LongPathsEnabled)"
    try { "git_long_paths=$(git config --system --get core.longpaths)" } catch { "git_long_paths=missing" }
  register: common_windows_long_paths_info
  changed_when: false
  failed_when: false
  when: ansible_facts.os_family == 'Windows'

- name: Report Windows long path state
  ansible.builtin.debug:
    var: common_windows_long_paths_info.stdout_lines
  changed_when: false
  when: ansible_facts.os_family == 'Windows'
