---
- name: Ensure user SSH directory exists
  ansible.windows.win_file:
    path: "{{ ansible_env.USERPROFILE }}\\.ssh"
    state: directory
  when: ssh_generate_key or authorized_login_keys | length > 0 or configure_loopback_ssh
  tags: [ssh]

- name: Check for user SSH key
  ansible.windows.win_stat:
    path: "{{ ansible_env.USERPROFILE }}\\.ssh\\id_{{ ssh_key_type }}"
  register: common_windows_ssh_key
  when: ssh_generate_key
  tags: [ssh]

- name: Generate user SSH key when missing
  ansible.windows.win_command: >-
    ssh-keygen.exe -t {{ ssh_key_type }} -N "" -f "{{ ansible_env.USERPROFILE }}\\.ssh\\id_{{ ssh_key_type }}"
  when: ssh_generate_key and not common_windows_ssh_key.stat.exists
  tags: [ssh]

- name: Add configured authorized login keys
  ansible.windows.win_shell: |
    $authorizedKeys = Join-Path $env:USERPROFILE '.ssh\authorized_keys'
    $key = @'
    {{ item }}
    '@.Trim()
    if (-not (Test-Path $authorizedKeys)) { New-Item -ItemType File -Path $authorizedKeys -Force | Out-Null }
    $existing = Get-Content -Path $authorizedKeys -ErrorAction SilentlyContinue
    if ($existing -contains $key) { 'present' } else { Add-Content -Path $authorizedKeys -Value $key; 'added' }
  loop: "{{ authorized_login_keys }}"
  register: common_windows_authorized_keys
  changed_when: "'added' in common_windows_authorized_keys.stdout"
  no_log: true
  when: authorized_login_keys | length > 0
  tags: [ssh]

- name: Read generated public key for loopback SSH
  ansible.windows.win_shell: |
    Get-Content -Path "{{ ansible_env.USERPROFILE }}\\.ssh\\id_{{ ssh_key_type }}.pub" -Raw
  register: common_windows_public_key
  changed_when: false
  when: configure_loopback_ssh
  tags: [ssh]

- name: Authorize generated key for loopback SSH
  ansible.windows.win_shell: |
    $authorizedKeys = Join-Path $env:USERPROFILE '.ssh\authorized_keys'
    $key = @'
    {{ common_windows_public_key.stdout | trim }}
    '@.Trim()
    if (-not (Test-Path $authorizedKeys)) { New-Item -ItemType File -Path $authorizedKeys -Force | Out-Null }
    $existing = Get-Content -Path $authorizedKeys -ErrorAction SilentlyContinue
    if ($existing -contains $key) { 'present' } else { Add-Content -Path $authorizedKeys -Value $key; 'added' }
  register: common_windows_loopback_key
  changed_when: "'added' in common_windows_loopback_key.stdout"
  when: configure_loopback_ssh
  tags: [ssh]

- name: Check requested Windows SSH default shell path
  ansible.windows.win_stat:
    path: "{{ windows_ssh_default_shell_path }}"
  register: common_windows_default_shell
  when: configure_windows_ssh_default_shell
  tags: [ssh]

- name: Refuse WindowsApps SSH DefaultShell alias
  ansible.builtin.fail:
    msg: "Refusing to set OpenSSH DefaultShell to a WindowsApps app execution alias. Use a real pwsh.exe path."
  when:
    - configure_windows_ssh_default_shell
    - "'WindowsApps' in windows_ssh_default_shell_path"
  tags: [ssh]

- name: Configure Windows OpenSSH DefaultShell when explicitly requested
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\OpenSSH
    name: DefaultShell
    data: "{{ windows_ssh_default_shell_path }}"
    type: string
  when:
    - configure_windows_ssh_default_shell
    - common_windows_default_shell.stat.exists
  tags: [ssh]

- name: Enable Win32 long paths when requested
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem
    name: LongPathsEnabled
    data: 1
    type: dword
  when: configure_windows_long_paths
  tags: [common, git, long_paths]

- name: Enable Git long paths when requested
  ansible.windows.win_shell: |
    $current = git config --system --get core.longpaths
    if ($current -eq 'true') { 'present' } else { git config --system core.longpaths true; 'changed' }
  register: common_windows_git_longpaths
  changed_when: "'changed' in common_windows_git_longpaths.stdout"
  when: configure_windows_long_paths
  tags: [common, git, long_paths]

- name: Configure global git user name
  ansible.windows.win_shell: |
    $current = git config --global --get user.name
    if ($current -eq '{{ git_user_name }}') { 'present' } else { git config --global user.name '{{ git_user_name }}'; 'changed' }
  register: common_windows_git_name
  changed_when: "'changed' in common_windows_git_name.stdout"
  when: configure_git and git_user_name is not none
  tags: [git]

- name: Configure global git user email
  ansible.windows.win_shell: |
    $current = git config --global --get user.email
    if ($current -eq '{{ git_user_email }}') { 'present' } else { git config --global user.email '{{ git_user_email }}'; 'changed' }
  register: common_windows_git_email
  changed_when: "'changed' in common_windows_git_email.stdout"
  when: configure_git and git_user_email is not none
  tags: [git]

- name: Configure default CLI editor
  ansible.windows.win_shell: |
    $current = git config --global --get core.editor
    if ($current -eq 'nvim') { 'present' } else { git config --global core.editor nvim; 'changed' }
  register: common_windows_git_editor
  changed_when: "'changed' in common_windows_git_editor.stdout"
  tags: [git]
