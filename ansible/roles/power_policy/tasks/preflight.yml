---
- name: Check POSIX power policy state
  ansible.builtin.shell: |
    set -o pipefail
    set +e
    if command -v pmset >/dev/null 2>&1; then pmset -g custom 2>/dev/null || true; fi
    if command -v systemctl >/dev/null 2>&1; then loginctl show-user "$(id -un)" 2>/dev/null | grep -E 'Linger|State' || true; fi
    if command -v gsettings >/dev/null 2>&1; then
      gsettings get org.gnome.desktop.session idle-delay 2>/dev/null || true
      gsettings get org.gnome.desktop.screensaver lock-enabled 2>/dev/null || true
    fi
  args:
    executable: /bin/bash
  register: power_policy_posix_preflight
  changed_when: false
  failed_when: false
  when: ansible_facts.os_family != 'Windows'

- name: Report POSIX power policy state
  ansible.builtin.debug:
    var: power_policy_posix_preflight.stdout_lines
  changed_when: false
  when: ansible_facts.os_family != 'Windows'

- name: Check Windows power policy state
  ansible.windows.win_shell: |
    powercfg /GETACTIVESCHEME
    powercfg /QUERY SCHEME_CURRENT SUB_SLEEP STANDBYIDLE
    powercfg /QUERY SCHEME_CURRENT SUB_VIDEO VIDEOIDLE
  register: power_policy_windows_preflight
  changed_when: false
  failed_when: false
  when: ansible_facts.os_family == 'Windows'

- name: Report Windows power policy state
  ansible.builtin.debug:
    var: power_policy_windows_preflight.stdout_lines
  changed_when: false
  when: ansible_facts.os_family == 'Windows'
