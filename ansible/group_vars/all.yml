---
# Optional prompts from the old setup scripts become explicit variables here.
# A false/null value means leave existing configuration unchanged.

machine_profile: null

configure_git: false
git_user_name: null
git_user_email: null

ssh_generate_key: true
ssh_key_type: ed25519
ssh_key_file: "{{ ansible_env.HOME | default('~') }}/.ssh/id_{{ ssh_key_type }}"
ssh_public_key_file: "{{ lookup('ansible.builtin.env', 'WENDY_ANSIBLE_SSH_PUBLIC_KEY_FILE') | default('', true) }}"
ssh_public_key_value: >-
  {{
    lookup('ansible.builtin.file', ssh_public_key_file, errors='ignore') | trim
    if ssh_public_key_file | length > 0
    else ''
  }}
authorized_login_keys: "{{ [ssh_public_key_value] if ssh_public_key_value | length > 0 else [] }}"
configure_loopback_ssh: false
setup_passwordless_sudo: false

install_direnv: false
install_swift: true
install_wendy_cli: false
install_wendy_agent: false
install_claude_code: false
install_openai_codex: false
install_github_runner: false
install_container_runtime: true
install_visual_studio_build_tools: true
install_gnu_make: true

configure_remote_access: false
configure_power_policy: false
configure_auto_login: false
configure_developer_mode: false
configure_windows_terminal_powershell: false
configure_windows_ssh_default_shell: false
windows_ssh_default_shell_path: C:\\Program Files\\PowerShell\\7\\pwsh.exe
configure_windows_long_paths: false
configure_screen_lock_policy: false

clone_repository: false
wendy_repo_url: https://github.com/wendylabsinc/wendy-agent.git
clone_destination: "{{ (ansible_env.USERPROFILE if (ansible_facts.os_family | default('')) == 'Windows' else (ansible_env.HOME | default('~'))) }}/Projects/WendyLabs/wendy-agent"

swift_version_file: "{{ playbook_dir }}/../../.swift-version"
swift_version: null
swiftly_install_url: https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz

homebrew_prefix: "{{ '/opt/homebrew' if ansible_facts.architecture | default('') == 'arm64' else '/usr/local' }}"
homebrew_bin: "{{ homebrew_prefix }}/bin/brew"

macos_homebrew_packages:
  - git
  - curl
  - go
  - neovim
  - node
  - swiftly
macos_homebrew_casks: []

ubuntu_apt_packages:
  - git
  - curl
  - ca-certificates
  - gnupg
  - build-essential
  - golang-go
  - neovim
  - nodejs
  - npm
  - avahi-daemon
  - libnss-mdns
  - openssh-client
ubuntu_install_openssh_server: false

container_runtime_user: "{{ ansible_user_id }}"
container_runtime_manage_docker_repo: true
container_runtime_prerequisite_packages:
  - ca-certificates
  - curl
  - gnupg
container_runtime_docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
container_runtime_conflicting_packages:
  - docker.io
  - docker-doc
  - docker-compose
  - docker-compose-v2
  - podman-docker
  - containerd
  - runc
container_runtime_docker_arch_map:
  x86_64: amd64
  aarch64: arm64
  armv7l: armhf
container_runtime_docker_apt_key_url: https://download.docker.com/linux/ubuntu/gpg
container_runtime_docker_apt_keyring: /etc/apt/keyrings/docker.asc
container_runtime_docker_apt_repository_url: https://download.docker.com/linux/ubuntu
container_runtime_docker_apt_channel: stable

windows_winget_packages:
  - id: Git.Git
    name: Git
  - id: GoLang.Go
    name: Go
  - id: Neovim.Neovim
    name: Neovim
  - id: Microsoft.PowerShell
    name: PowerShell
  - id: OpenJS.NodeJS.LTS
    name: Node.js LTS
windows_claude_code_package:
  id: Anthropic.ClaudeCode
  name: Claude Code
windows_openai_codex_package:
  id: OpenAI.Codex
  name: Codex
windows_make_package:
  id: MSYS2.MSYS2
  name: MSYS2
windows_swift_package:
  id: Swift.Toolchain
  name: Swift toolchain
windows_visual_studio_build_tools_package:
  id: Microsoft.VisualStudio.2022.BuildTools
  name: Visual Studio Build Tools
  override: --add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --passive --norestart

github_runner_dir: "{{ (ansible_env.USERPROFILE if (ansible_facts.os_family | default('')) == 'Windows' else (ansible_env.HOME | default('~'))) }}/.github/actions-runner"
github_runner_url: https://github.com/OWNER/REPO
github_runner_token: null
github_runner_mode: manual # manual | login | service
github_runner_labels: []
github_runner_site_labels: []
github_runner_machine_labels: []
github_runner_platform_labels: []
github_runner_group: null
github_runner_prompt_for_token: true
github_runner_name: "{{ inventory_hostname_short | default(inventory_hostname) }}"
github_runner_work_dir: _work
github_runner_service_name: github-actions-runner

wendy_cli_install_url: https://raw.githubusercontent.com/wendylabsinc/wendy-agent/main/docs/cli.sh
wendy_agent_install_url: https://raw.githubusercontent.com/wendylabsinc/wendy-agent/main/docs/agent.sh
wendy_install_dir: /usr/local/bin
