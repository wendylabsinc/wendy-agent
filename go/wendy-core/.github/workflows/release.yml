name: Release Wendy Core

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the selected SemVer tag (requires configured registries and approval)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: core-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate coordinated distribution versions and tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python scripts/build.py version --tag "$REF_NAME"
          else
            python scripts/build.py version
          fi

  build:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/build-core.yml

  npm:
    needs: build
    if: github.ref_type == 'tag' && vars.ENABLE_CORE_PUBLISH == 'true' && (github.event_name == 'push' || inputs.publish)
    environment: core-release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-release
          path: release
      - name: Publish one npm package with native and browser assets via trusted publishing
        run: cd release && sha256sum --check SHA256SUMS && npm publish ./*.tgz --provenance --access public

  pypi:
    needs: build
    if: github.ref_type == 'tag' && vars.ENABLE_CORE_PUBLISH == 'true' && (github.event_name == 'push' || inputs.publish)
    environment: core-release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-release
          path: release
      - name: Verify and isolate Python artifacts
        run: |
          cd release && sha256sum --check SHA256SUMS
          mkdir ../wheels && cp ./*.whl ../wheels/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: wheels/

  maven:
    needs: build
    if: github.ref_type == 'tag' && vars.ENABLE_CORE_PUBLISH == 'true' && (github.event_name == 'push' || inputs.publish)
    environment: core-release
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: .build/artifacts
      - name: Restore only tested native artifacts
        run: |
          cd .build/artifacts/core-release && sha256sum --check SHA256SUMS
          cd ../../..
          python3 scripts/build.py assemble
      - name: Publish Kotlin/JVM to GitHub's Maven registry
        env:
          MAVEN_PUBLISH_URL: https://maven.pkg.github.com/${{ github.repository }}
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: distributions/kotlin/gradlew -p distributions/kotlin publish --no-daemon

  swiftpm:
    needs: build
    if: github.ref_type == 'tag' && vars.ENABLE_CORE_PUBLISH == 'true' && (github.event_name == 'push' || inputs.publish)
    environment: core-release
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-release
          path: release
      - name: Check the package bytes and required mirror configuration
        env:
          SWIFTPM_REPOSITORY: ${{ vars.SWIFTPM_REPOSITORY }}
        run: |
          test -n "$SWIFTPM_REPOSITORY"
          cd release && sha256sum --check SHA256SUMS
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ vars.SWIFTPM_APP_ID }}
          private-key: ${{ secrets.SWIFTPM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.SWIFTPM_REPOSITORY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ vars.SWIFTPM_REPOSITORY }}
          token: ${{ steps.app.outputs.token }}
          ref: main
          fetch-depth: 0
          path: swiftpm-mirror
          # Ephemeral GitHub App credentials are needed only for the atomic push.
          persist-credentials: true
      - name: Publish a normal, independently consumable SwiftPM tag
        run: python scripts/publish_swift.py release/*-swiftpm.tar.gz swiftpm-mirror

  github:
    needs: [build, npm, pypi, maven, swiftpm]
    if: github.ref_type == 'tag' && vars.ENABLE_CORE_PUBLISH == 'true' && (github.event_name == 'push' || inputs.publish)
    environment: core-release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-release
          path: release
      - name: Verify the release bytes
        run: cd release && sha256sum --check SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*
          fail_on_unmatched_files: true
          overwrite_files: false
          generate_release_notes: false
          body: Wendy Core distributions built and tested together. See release.json for targets and SHA256SUMS for integrity.
