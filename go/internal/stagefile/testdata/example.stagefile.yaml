version: 1
stages:
  - name: deps
    from: python:3.12-slim
    install:
      apt:
        packages: [build-essential]
      pip:
        requirements: requirements.txt

  - name: app
    from: python:3.12-slim
    copy:
      - from: deps
        paths: ["/usr/local/lib/python3.12/site-packages"]
      - from: local
        paths: ["app.py"]
    entrypoint:
      exec: [python3, app.py]
